# Path and domain risk rules for the Compact V2 governance helper.
#
# Used only by scripts/governance/compact-check.ts. The validator does not read
# this file. A rule maps a repository path glob to a risk domain and a minimum
# risk level; the highest matching level is the computed `path_rule_risk`.
#
# Seed: the domains come from the existing policy in
# .agents/skills/renivet-spec/references/governance-workflow.md
# (authentication, authorization, tenant isolation, customer identity and PII,
# payment, finance, inventory, order lifecycle, schema changes, destructive
# operations, security-sensitive APIs, external integrations). Each path family
# comes from a path that exists in this repository today (the test suite fails
# if a glob matches no tracked file). Levels are initial values; calibrate them
# from the dry run and the pilot. Owner: the engineering lead role.
#
# Glob syntax: `*` matches within a path segment, `**` matches across segments,
# `?` matches one character. No other glob features are supported.

version: 1

# Level given to a changed path that matches no rule and is not non-behavioural.
default_level: L1

# Paths that carry no runtime behaviour. They never raise risk (level L0).
non_behavioural:
    - "docs/**"
    - "**/*.md"
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.spec.ts"
    - "**/*.spec.tsx"
    - "scripts/governance/fixtures/**"
    - "scripts/governance/fixtures-compact/**"

# Investigation budget by final risk level. Bounded guidance and a lint of the
# scope recorded in the contract; it is not a live count of session reads.
budgets:
    L1:
        files: 8
        hops: 1
    L2:
        files: 25
        hops: 2
    L3:
        files: 60
        hops: 3

# Domains whose presence at L3 requires a recorded investigation in that domain.
mandatory_trace_domains:
    - authn_authz
    - tenant_isolation
    - pii_identity
    - payment
    - orders
    - inventory
    - financial
    - schema_migration

# L2 Critic: categories examined in depth, selected from the domains hit.
# Keys of each list are the categories already required by the contract
# (requirements_scenarios, failure_recovery, security_privacy,
# state_data_consistency, integrations_idempotency, compatibility_migration,
# observability_testability, assumptions_dependencies). Every other category
# still receives a one-line answer; nothing is marked not applicable unchecked.
critic_focus:
    authn_authz: [security_privacy, state_data_consistency]
    tenant_isolation: [security_privacy, assumptions_dependencies]
    pii_identity: [security_privacy, compatibility_migration]
    payment:
        [state_data_consistency, integrations_idempotency, failure_recovery]
    orders: [state_data_consistency, failure_recovery]
    inventory: [state_data_consistency, failure_recovery]
    financial: [state_data_consistency, integrations_idempotency]
    schema_migration: [compatibility_migration, failure_recovery]
    destructive: [failure_recovery, compatibility_migration]
    external_provider: [integrations_idempotency, failure_recovery]
    customer_critical_flow: [requirements_scenarios, failure_recovery]
    default: [requirements_scenarios, observability_testability]

# Pilot preparation. Read by people, not by the helper. All values are INITIAL
# thresholds from the Compact V2 plan and are fixed by the owner before the
# pilot starts; they are not findings. Run each side in a fresh scratch worktree
# (current skills from the default branch, Compact V2 from this branch) with no
# Linear writes. Tokens are recorded as NOT MEASURED when session logs are
# unavailable.
pilot:
    issues:
        spec_lower: REN-250 # proposed L1; the final level comes from `compact-check risk`
        spec_l3: REN-251 # authorization and security path
        review_l2: REN-108 # existing L2 review specimen (its recorded range is stale: see dry run)
        review_l3: REN-115 # existing L3 review specimen
    gates:
        G1: L3 rigour preserved (all eight Critic categories, AI evidence on every contract ID)
        G2: every seeded fault the current system catches is caught, plus F1 to F7
        G3: existing validator tests pass unchanged and every pilot contract validates
        G4: validator failures and missing evidence are not higher than current
    benefits:
        B1_l1_l2: at least one of repository reads, execution time or artifact size falls by 20 percent or more with none rising by more than 10 percent
        B2_l3: no increase above 10 percent in reads, time or artifact size
        B3: time to first correct action is no worse than current
    measure_only:
        - execution time
        - repository reads and searches
        - Linear reads
        - artifact size
        - Critic invocations and cycles
        - developer time to first correct action
        - governance coverage and seeded-fault parity
        - rework and missing evidence

