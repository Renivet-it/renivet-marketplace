name: Governance validation

on:
    pull_request:

permissions:
    contents: read

jobs:
    validate-governance:
        name: Validate governance contracts
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.2.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Test deterministic validator
              run: bun test scripts/governance/validate-work-item.test.ts

            - name: Validate changed work items
              shell: bash
              run: |
                  mapfile -d '' work_item_dirs < <(
                    git diff --name-only --diff-filter=ACMRD -z \
                      "${{ github.event.pull_request.base.sha }}" \
                      "${{ github.event.pull_request.head.sha }}" \
                      -- 'docs/.work-items/*/work-item.yaml' 'docs/.work-items/*/REVIEW.md' |
                      while IFS= read -r -d '' path; do
                        printf '%s\0' "${path%/*}"
                      done |
                      sort -zu
                  )

                  if (( ${#work_item_dirs[@]} == 0 )); then
                    echo "No changed governance work items."
                    exit 0
                  fi

                  for work_item_dir in "${work_item_dirs[@]}"; do
                    work_item="${work_item_dir}/work-item.yaml"
                    if [[ ! -e "$work_item" ]]; then
                      mapfile -d '' tracked_files < <(
                        git ls-tree -r --name-only -z HEAD -- "$work_item_dir/*"
                      )
                      if (( ${#tracked_files[@]} > 0 )); then
                        echo "::error file=$work_item::Missing work-item.yaml while tracked files remain in $work_item_dir."
                        printf 'Tracked file remains: %s\n' "${tracked_files[@]}"
                        exit 1
                      fi

                      echo "Skipping removed governance work item: $work_item_dir"
                      continue
                    fi

                    bun run governance:validate -- "$work_item"
                  done
