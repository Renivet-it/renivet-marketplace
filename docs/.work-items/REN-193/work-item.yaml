test_expectations:
    - {
          id: TEXP-193-001,
          category: unit,
          classification: REQUIRED,
          reason: "Verify priority aliases, missing-priority behavior, alphabetical remainder, preview limit, and search.",
          scenarios: [SCN-193-001, SCN-193-003, SCN-193-005],
      }
    - {
          id: TEXP-193-002,
          category: component,
          classification: REQUIRED,
          reason: "Verify mobile sheet and all-brand directory render stored logos/names, fallback safely, and use canonical links.",
          scenarios: [SCN-193-002, SCN-193-003, SCN-193-005],
      }
    - {
          id: TEXP-193-003,
          category: accessibility,
          classification: REQUIRED,
          reason: "Verify desktop hover/focus, mobile/dialog focus management, escape dismissal, responsive layout, and existing header compatibility.",
          scenarios: [SCN-193-001, SCN-193-002, SCN-193-003, SCN-193-006],
      }
    - {
          id: TEXP-193-004,
          category: security,
          classification: REQUIRED,
          reason: "Verify the public query filters active brands and selects only the approved public fields.",
          scenarios: [SCN-193-004],
      }
