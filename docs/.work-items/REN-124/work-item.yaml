    - { scenario_id: SCN-002, invariant_ids: [INV-002, INV-004, INV-005] }
    - { scenario_id: SCN-003, invariant_ids: [INV-002, INV-004, INV-005] }
    - { scenario_id: SCN-004, invariant_ids: [INV-001, INV-005] }
    - { scenario_id: SCN-005, invariant_ids: [INV-002, INV-004] }
