    - { requirement_id: REQ-003, scenario_ids: [SCN-002, SCN-003, SCN-004, SCN-005, SCN-007, SCN-008] }
    - { requirement_id: REQ-004, scenario_ids: [SCN-006, SCN-007, SCN-008] }
    - { requirement_id: REQ-005, scenario_ids: [SCN-009] }
    - { requirement_id: REQ-006, scenario_ids: [SCN-011] }
