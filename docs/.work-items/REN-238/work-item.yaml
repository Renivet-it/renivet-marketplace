    - {requirement_id: REQ-238-3, scenario_ids: [SCN-238-3]}
    - {requirement_id: REQ-238-4, scenario_ids: [SCN-238-2, SCN-238-3]}
    - {requirement_id: REQ-238-5, scenario_ids: [SCN-238-3, SCN-238-4]}
  scenario_to_invariants:
