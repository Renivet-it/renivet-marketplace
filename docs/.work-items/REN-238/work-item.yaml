    - {scenario_id: SCN-238-3, invariant_ids: [INV-238-1, INV-238-3]}
    - {scenario_id: SCN-238-4, invariant_ids: [INV-238-1, INV-238-4]}
  scenario_to_test_expectations:
    - {scenario_id: SCN-238-1, test_expectation_ids: [TEXP-238-1]}
    - {scenario_id: SCN-238-2, test_expectation_ids: [TEXP-238-2]}
    - {scenario_id: SCN-238-3, test_expectation_ids: [TEXP-238-3]}
    - {scenario_id: SCN-238-4, test_expectation_ids: [TEXP-238-4]}
