    categories_reviewed: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
    findings:
        - { id: CRIT-262-001, severity: DESIGN_BLOCKER, status: resolved, summary: "Corporate uses a dedicated intent/reconciliation boundary; REN-255 general-order receipts are not generalized in this task." }
        - { id: CRIT-262-002, severity: DESIGN_BLOCKER, status: resolved, summary: "Advance recovery uses an immutable validated pre-capture order snapshot." }
        - { id: CRIT-262-003, severity: MAJOR, status: accepted, summary: "Balance/payment-request provider binding must be compare-and-set and immutable." }
        - { id: CRIT-262-004, severity: DESIGN_BLOCKER, status: resolved, summary: "Overpayment fails closed; provider-paid excess is handled through an auditable retryable refund." }
        - { id: CRIT-262-005, severity: MAJOR, status: accepted, summary: "Webhook and operator recovery need durable intent mapping." }
        - { id: CRIT-262-006, severity: MAJOR, status: accepted, summary: "Document and payment effects need atomic or retryable completion." }
        - { id: CRIT-262-007, severity: MINOR, status: accepted, summary: "Observability fields and secret-safe logging should be made concrete in implementation." }
    approval:
    state: APPROVED
    design_blockers: []
    approved_by: Ayan Ganguly
