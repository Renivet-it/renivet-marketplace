schema_version: "1.0"
task:
    id: REN-210
    title: "[FCCP][P1] Automate Contracted Payment Fee — Extract Exact Clause Wording First"
    source: linear
    branch: feat/ren-203-spec
    status: BLOCKED
    linear:
        url: https://linear.app/renivet/issue/REN-210/fccpp1-automate-contracted-payment-fee-extract-exact-clause-wording
        priority: High
        labels: [Feature]
        status: Backlog
        assignee: Ayan Ganguly
        project: "Renivet — Financial & Compliance Control Program"
        parent: REN-202
        linear_branch: ayanganganguly333/ren-210-fccp1-automate-contracted-payment-fee-extract-exact-clause
risk:
    initial_risk: L3
    path_rule_risk: L3
    semantic_risk: L3
    final_risk: L3
    reasons:
        - "The feature changes seller payout deductions and therefore future payable amounts."
        - "The contractual formula is ambiguous and the source document is unavailable."
        - "Scope, auditability, and separation from gateway costs are financial and compliance boundaries."
    escalation_history: []
investigation:
    depth: dependency_tracing
    investigated_areas: [Linear issue/comments/relations, payouts.ts, finance code, admin reports/exports, payout statement components, REN-208 agreement repository, BIZ-14 evidence]
    excluded_areas: [payout implementation, payout execution, historical backfill, gateway-cost capture, commission/TDS/TCS/holdback changes]
    dependencies: [DEP-210-001, DEP-210-002, DEP-210-003, DEP-210-004]
    integrations: [INT-210-001, INT-210-002]
    security_boundaries: [SEC-210-001, SEC-210-002]
    state_transitions: [evidence_missing, clause_extracted, formula_confirmed, fee_applied, fee_not_applied]
    related_tests: [TEXP-210-001, TEXP-210-002, TEXP-210-003, TEXP-210-004, TEXP-210-005]
    uncertainties: ["Signed agreement PDF is unavailable.", "Manual reconciliation process is undocumented.", "Formula base, rounding, granularity, and reverse/RTO treatment are unknown."]
requirements:
    - { id: REQ-210-001, description: "Record the Payment Fee clause verbatim from the signed agreement before implementation.", type: evidence }
    - { id: REQ-210-002, description: "Document or explicitly mark unresolved the formula base, rounding, granularity, and Forward/Reverse/RTO treatment.", type: safety }
    - { id: REQ-210-003, description: "Document the existing manual Admin reconciliation process before replacement.", type: operational }
    - { id: REQ-210-004, description: "Keep applicable-brand scope limited to sellers with confirmed agreements and preserve UNKNOWN for others.", type: authorization }
    - { id: REQ-210-005, description: "Implement no fee calculation until the extracted wording is independently confirmed.", type: financial_control }
    - { id: REQ-210-006, description: "When unblocked, make the fee auditable, agreement-version scoped, and visible on settlement statements without changing unrelated payout deductions.", type: auditability }
scenarios:
    - { id: SCN-210-001, description: "Primary agreement text is available and the clause is recorded verbatim.", requirement_ids: [REQ-210-001, REQ-210-002] }
    - { id: SCN-210-002, description: "The document is silent on an arithmetic or scope dimension and it is recorded as document does not specify.", requirement_ids: [REQ-210-002] }
    - { id: SCN-210-003, description: "Current manual reconciliation is documented with owner, timing, base, and record.", requirement_ids: [REQ-210-003] }
    - { id: SCN-210-004, description: "Brands without confirmed applicable agreements remain UNKNOWN and receive no fee.", requirement_ids: [REQ-210-004, REQ-210-005] }
    - { id: SCN-210-005, description: "After confirmation, fee calculation is line-level auditable and settlement-visible without changing other deductions.", requirement_ids: [REQ-210-006] }
invariants:
    - { id: INV-210-001, description: "No engineering inference becomes the contractual formula." }
    - { id: INV-210-002, description: "No brand without a confirmed applicable agreement receives the fee." }
    - { id: INV-210-003, description: "Gateway cost remains distinct from contractual Payment Fee." }
    - { id: INV-210-004, description: "Unconfirmed formula produces no fee deduction and an explicit not-applied record." }
    - { id: INV-210-005, description: "Commission, TDS, TCS, holdback, and historical payout records remain unchanged." }
flows:
    - { id: FLOW-210-001, description: "Evidence is collected and confirmed before formula design.", state_transitions: [evidence_missing, clause_extracted, formula_confirmed] }
    - { id: FLOW-210-002, description: "Confirmed fee is applied only to an eligible agreement-scoped seller and recorded as a distinct deduction.", state_transitions: [formula_confirmed, fee_applied, fee_not_applied] }
dependencies:
    - { id: DEP-210-001, name: signed Terra Luna agreement, purpose: "Primary clause evidence", description: "The source PDF/Annexure 4 is required; audit transcription is insufficient.", status: blocked }
    - { id: DEP-210-002, name: REN-208, purpose: "Agreement-version storage and access", description: "The fee must cite a governed agreement version.", status: resolved }
    - { id: DEP-210-003, name: REN-209, purpose: "Commercial-term configuration", description: "Confirmed fee value/formula belongs in agreement-linked commercial configuration.", status: blocked }
    - { id: DEP-210-004, name: manual Admin reconciliation process, purpose: "Replacement baseline", description: "Current owner/process/base/record are not evidenced in the repository.", status: blocked }
integrations:
    - { id: INT-210-001, system: payout engine and settlement statement, purpose: "Distinct auditable fee deduction", failure_mode: "Wrong formula or scope changes seller payable amounts", retry_idempotency: "No fee is applied while formula or agreement scope is unconfirmed." }
    - { id: INT-210-002, system: agreement repository and audit log, purpose: "Clause/source traceability", failure_mode: "A deduction without clause/version/actor evidence must fail closed", retry_idempotency: "Audit/source linkage must be committed with the deduction." }
personas:
    - { id: PER-210-001, role: finance_operator, applicability: "Owns manual reconciliation and confirms operational baseline." }
    - { id: PER-210-002, role: renivet_admin, applicability: "Maintains approved configuration after evidence confirmation." }
security_boundaries:
    - { id: SEC-210-001, description: "Only authorized internal finance/admin roles may configure or apply the fee." }
    - { id: SEC-210-002, description: "Agreement contents, signed URLs, and financial deduction evidence are not exposed to brands without scope authorization." }
business_rules:
    - { id: BR-210-001, description: "The document, not engineering inference or an existing report assumption, defines the formula." }
    - { id: BR-210-002, description: "Contractual Payment Fee is distinct from Renivet's Razorpay gateway cost." }
    - { id: BR-210-003, description: "No retrospective historical payout backfill is included." }
decisions:
    - { id: DEC-210-001, question: "What is the verbatim Annexure 4 clause and what formula does the document specify?", class: HUMAN_CONFIRMATION, status: unresolved, recommendation: "Provide the signed PDF/Annexure 4 or record the verified extraction before implementation.", basis: "Linear REN-210 explicitly blocks engineering interpretation.", confidence: high, consequence: high, human_confirmation_required: true }
    - { id: DEC-210-002, question: "What is the current manual reconciliation process?", class: HUMAN_CONFIRMATION, status: unresolved, recommendation: "Provide the owner, timing, base, and record used today.", basis: "The issue requires automation to replace a documented process, but repository evidence is absent.", confidence: high, consequence: medium, human_confirmation_required: true }
test_expectations:
    - { id: TEXP-210-001, category: business_uat, classification: REQUIRED, reason: "Clause extraction and ambiguity register must be confirmed against the primary document.", scenarios: [SCN-210-001, SCN-210-002] }
    - { id: TEXP-210-002, category: exploratory, classification: REQUIRED, reason: "Manual reconciliation process must be observed and documented before replacement.", scenarios: [SCN-210-003] }
    - { id: TEXP-210-003, category: unit, classification: REQUIRED, reason: "Confirmed formula boundaries, rounding, and no-fee behavior must be deterministic after unblocking.", scenarios: [SCN-210-004, SCN-210-005] }
    - { id: TEXP-210-004, category: integration, classification: REQUIRED, reason: "Agreement-scoped deduction and settlement statement traceability require end-to-end proof.", scenarios: [SCN-210-004, SCN-210-005] }
    - { id: TEXP-210-005, category: regression, classification: REQUIRED, reason: "Unrelated deductions, gateway costs, and historical payouts must remain unchanged.", scenarios: [SCN-210-005] }
critic:
    required: true
    completed: true
    artifact: CRITIQUE.md
    reviewer: independent fresh-context critic
    fresh_context: true
    read_only: true
    required_categories: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
    categories_reviewed: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
    findings:
        - { id: CRIT-210-001, severity: DESIGN_BLOCKER, status: open, summary: "Primary clause source is unavailable and transcription is not authoritative.", references: [REQ-210-001, DEC-210-001] }
        - { id: CRIT-210-002, severity: DESIGN_BLOCKER, status: open, summary: "Formula semantics and manual process are unresolved.", references: [REQ-210-002, REQ-210-003, DEC-210-002] }
        - { id: CRIT-210-003, severity: MAJOR, status: open, summary: "Existing admin report assumptions must not be promoted into payout logic.", references: [REQ-210-005, INV-210-001, INV-210-003] }
approval:
