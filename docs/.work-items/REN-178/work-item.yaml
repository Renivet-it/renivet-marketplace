        - {scenario_id: SCN-010, invariant_ids: [INV-006]}
        - {scenario_id: SCN-011, invariant_ids: [INV-007]}
    scenario_to_test_expectations:
        - {scenario_id: SCN-001, test_expectation_ids: [TEXP-001, TEXP-006]}
        - {scenario_id: SCN-002, test_expectation_ids: [TEXP-002]}
