        - {scenario_id: SCN-006, invariant_ids: [INV-003, INV-007]}
        - {scenario_id: SCN-007, invariant_ids: [INV-004, INV-005]}
        - {scenario_id: SCN-008, invariant_ids: [INV-001, INV-004]}
