schema_version: "1.0"
task:
    id: REN-178
    title: "[Corporate Order] Persist structured customization and extras through all documents"
    source: linear
    branch: ayanganguly333/ren-178-corporate-order-customizationextras-entered-by-admin-are
    status: BLOCKED
    linear:
        url: https://linear.app/renivet/issue/REN-178/corporate-order-customizationextras-entered-by-admin-are-silently
        priority: Urgent
        labels: [Bug]
        status: Backlog
        assignee: Ayan Ganguly
        project: null
        milestone: null
risk:
    initial_risk: L3
    path_rule_risk: L3
    semantic_risk: L3
    final_risk: L3
    reasons:
        - Schema and migration changes affect corporate order financial/document records.
        - Data crosses quote, payment, fulfillment, invoice, and settlement boundaries.
        - Artwork/reference metadata is customer and production data.
    escalation_history: []
investigation:
    depth: dependency_tracing
    investigated_areas:
        - Linear REN-178 description, updates, and related REN-177/180/187 issues
        - Existing corporateCustomizations schema and corporate quote/order/FO/document paths
        - Manual quote and Fulfillment Order UI/mutation payloads
        - Corporate PDF invoice and commercial document templates
        - Existing scalar customizationPaise persistence and historical records
        - Existing upload metadata and authorization boundaries
    excluded_areas:
        - Finance/CA decision on composite versus distinct GST treatment
        - Warehouse GRN controls in REN-183
        - New customization tax calculation rules
    dependencies: [DEP-001, DEP-002, DEP-003]
    integrations: [INT-001, INT-002, INT-003, INT-004]
    security_boundaries: [SEC-001, SEC-002, SEC-003]
    state_transitions:
        - customization_input -> persisted_quote_customizations
        - persisted_quote_customizations -> immutable_commercial_snapshot
        - immutable_commercial_snapshot -> fulfillment_and_customer_documents
    related_tests: [TEXP-001, TEXP-002, TEXP-003, TEXP-004]
    uncertainties:
        - Finance/CA tax treatment metadata vocabulary is not finalized.
        - Legacy scalar migration policy needs owner approval.
        - Exact product-line identifier is not present on all existing corporate orders.
dependencies:
    - id: DEP-001
      name: REN-177 authoritative commercial snapshot
      purpose: Provides one cross-document source for customization records.
      description: Customizations must be embedded in the same snapshot consumed by PI, FO, invoice, and settlement.
      status: unresolved
    - id: DEP-002
      name: Existing corporate customization schema
      purpose: Provides the starting persistence structure.
      description: Existing table is too sparse and requires field/relationship expansion and migration.
      status: unresolved
    - id: DEP-003
      name: Upload validation infrastructure
      purpose: Safely stores artwork/reference metadata.
      description: Reuse existing artworkFile validation and storage boundaries.
      status: resolved
requirements:
    - id: REQ-001
      description: Persist every entered customization as a structured record with name, description, amount, quantity/basis, production instruction, artwork/reference, tax-treatment metadata, parent product/order-line reference, and display order.
      type: explicit
    - id: REQ-002
      description: Propagate the same customization records unchanged through Quote, PI, Corporate Order, FO, Customer Invoice, and settlement/document outputs.
      type: explicit
    - id: REQ-003
      description: Include the FO Packaging/Extras input in the validated mutation payload and persistence path.
      type: explicit
    - id: REQ-004
      description: Preserve existing scalar customization amounts through an approved migration/compatibility representation.
      type: explicit
    - id: REQ-005
      description: Keep separate visual rows independent from tax treatment; do not invent or hard-code a customization GST rate in this task.
      type: explicit
    - id: REQ-006
      description: Preserve existing authorization, upload validation, tenant scoping, idempotency, and atomicity boundaries.
      type: inferred
scenarios:
    - id: SCN-001
      description: A quote with two customizations persists both records and snapshot fields exactly.
      requirement_ids: [REQ-001, REQ-002]
    - id: SCN-002
      description: FO Packaging/Extras is submitted, validated, persisted, and rendered downstream.
      requirement_ids: [REQ-003, REQ-002]
    - id: SCN-003
      description: Existing scalar customization amount remains readable after migration.
      requirement_ids: [REQ-004]
    - id: SCN-004
      description: Customization rows render separately without assigning an unapproved GST rate.
      requirement_ids: [REQ-005]
    - id: SCN-005
      description: Invalid artwork/reference input or unauthorized mutation is rejected without partial customization persistence.
      requirement_ids: [REQ-006]
    - id: SCN-006
      description: Retried or concurrent document generation does not duplicate or drop customization records.
      requirement_ids: [REQ-002, REQ-006]
invariants:
    - id: INV-001
      description: No accepted customization input is silently discarded.
    - id: INV-002
      description: Downstream documents read the same immutable customization snapshot.
    - id: INV-003
      description: Customization amounts and quantities reconcile exactly across records and totals.
    - id: INV-004
      description: Visual separation never implies an automatic tax classification.
    - id: INV-005
      description: Invalid or unauthorized input leaves no partial customization write.
flows:
    - id: FLOW-001
      description: UI input -> validation -> customization records -> quote snapshot.
      state_transitions: [customization_input -> persisted_quote_customizations]
    - id: FLOW-002
      description: Approved quote/order -> immutable snapshot -> PI/FO/invoice/settlement readers.
      state_transitions: [persisted_quote_customizations -> immutable_commercial_snapshot]
    - id: FLOW-003
      description: Legacy scalar -> explicit migrated compatibility row.
      state_transitions: [legacy_scalar -> persisted_quote_customizations]
integrations:
    - id: INT-001
      system: Corporate database
      purpose: Store structured customization records and relationships.
      failure_mode: Transaction rollback on persistence failure.
    - id: INT-002
      system: Corporate document services
      purpose: Read one customization snapshot for PI/FO/invoice/settlement.
      failure_mode: Missing snapshot data blocks or explicitly marks unavailable.
    - id: INT-003
      system: Artwork/reference upload pipeline
      purpose: Validate and persist file references.
      failure_mode: Invalid files are rejected before record creation.
    - id: INT-004
      system: REN-177 snapshot contract
      purpose: Prevent cross-document re-derivation.
      failure_mode: Schema mismatch blocks issuance until reconciled.
personas:
    - id: PER-001
      role: corporate_operations_admin
      applicability: Enters and manages customization records.
    - id: PER-002
      role: brand_production_user
      applicability: Receives complete FO customization instructions.
    - id: PER-003
      role: corporate_customer
      applicability: Receives complete, transparent invoice lines.
security_boundaries:
    - id: SEC-001
      description: Existing MANAGE_ORDERS authorization remains required for admin quote/FO mutations.
    - id: SEC-002
      description: Artwork/reference fields reuse existing upload validation and access controls.
    - id: SEC-003
      description: Customizations remain scoped to the owning quote/order and corporate tenant.
business_rules:
    - id: BR-001
      description: Product display rows and tax classification are separate concerns.
      source: REN-178 final Linear update.
    - id: BR-002
      description: Existing non-zero scalar customization amounts must not disappear.
      source: REN-178 rollback/release notes.
decisions:
    - id: DEC-001
      question: What composite/distinct tax treatment applies to customization lines?
      class: HUMAN_CONFIRMATION
      status: unresolved
      recommendation: Store treatment metadata only and defer rate calculation to REN-179/Finance decision.
      basis: Explicit REN-178 out-of-scope statement and Finance/CA dependency.
      confidence: high
      consequence: high
      human_confirmation_required: true
    - id: DEC-002
      question: How should legacy scalar customization amounts be represented?
      class: HUMAN_CONFIRMATION
      status: unresolved
      recommendation: Create one synthetic legacy row per non-zero scalar with metadata marking its origin.
      basis: Explicit REN-178 rollback requirement.
      confidence: medium
      consequence: high
      human_confirmation_required: true
test_expectations:
    - id: TEXP-001
      category: integration
      classification: REQUIRED
      reason: Verify two customizations survive Quote -> PI -> Order -> FO -> Invoice.
    - id: TEXP-002
      category: regression
      classification: REQUIRED
      reason: Verify FO Packaging/Extras is not dropped.
    - id: TEXP-003
      category: regression
      classification: REQUIRED
      reason: Verify legacy scalar migration/readability.
    - id: TEXP-004
      category: security
      classification: REQUIRED
      reason: Verify authorization, upload validation, and atomic rollback.
critic:
    required: true
    completed: true
    artifact: CRITIQUE.md
    reviewer: ren178_critic
    fresh_context: true
    read_only: true
    required_categories:
        - requirements_scenarios
        - failure_recovery
        - security_privacy
        - state_data_consistency
        - integrations_idempotency
        - compatibility_migration
        - observability_testability
        - assumptions_dependencies
    categories_reviewed:
        - requirements_scenarios
        - failure_recovery
        - security_privacy
        - state_data_consistency
        - integrations_idempotency
        - compatibility_migration
        - observability_testability
        - assumptions_dependencies
    findings:
        - id: CRIT-178-01
          severity: DESIGN_BLOCKER
          summary: Existing customization table lacks required structured fields and parent identity.
        - id: CRIT-178-02
          severity: DESIGN_BLOCKER
          summary: Canonical immutable customization snapshot and document linkage are unspecified.
        - id: CRIT-178-03
          severity: MAJOR
          summary: Parent/customization writes require transaction and retry semantics.
        - id: CRIT-178-04
          severity: MAJOR
          summary: Fulfillment Order extras are dropped and totals are independently derived.
        - id: CRIT-178-05
          severity: MAJOR
          summary: Quote revisions do not preserve customization rows.
        - id: CRIT-178-06
          severity: MAJOR
          summary: Legacy scalar migration and overlap need a deterministic backfill policy.
        - id: CRIT-178-07
          severity: MAJOR
          summary: Customization tax treatment must not inherit a hard-coded 18% behavior.
        - id: CRIT-178-08
          severity: MAJOR
          summary: Downstream document and settlement linkage is incomplete.
        - id: CRIT-178-09
          severity: DESIGN_BLOCKER
          summary: Single-product schema conflicts with Product to Customizations[] requirement.
        - id: CRIT-178-10
          severity: MINOR
          summary: Artwork references need ownership and file validation guarantees.
        - id: CRIT-178-11
          severity: MAJOR
          summary: Replacement orders need deterministic structured customization cloning.
        - id: CRIT-178-12
          severity: MINOR
          summary: API serializers and end-to-end/migration/concurrency tests are missing.
        - id: CRIT-178-13
          severity: MAJOR
          summary: UI paths hard-code or heuristically reconstruct customization GST/amounts.
        - id: CRIT-178-14
          severity: MINOR
          summary: Snapshot/customization mismatches lack explicit validation and observability.
        - id: CRIT-178-15
          severity: MAJOR
          summary: Schema/backfill rollout needs an idempotent expand and compatibility plan.
approval:
    state: BLOCKED
    design_blockers:
        - DEC-001: Finance/CA tax treatment metadata boundary is unresolved.
        - DEC-002: Legacy scalar customization migration policy requires owner confirmation.
    approved_by: null
traceability:
    requirement_to_scenarios:
        - { requirement_id: REQ-001, scenario_ids: [SCN-001] }
        - { requirement_id: REQ-002, scenario_ids: [SCN-001, SCN-002, SCN-006] }
        - { requirement_id: REQ-003, scenario_ids: [SCN-002] }
        - { requirement_id: REQ-004, scenario_ids: [SCN-003] }
        - { requirement_id: REQ-005, scenario_ids: [SCN-004] }
        - { requirement_id: REQ-006, scenario_ids: [SCN-005, SCN-006] }
    scenario_to_invariants:
        - { scenario_id: SCN-001, invariant_ids: [INV-001, INV-002, INV-003] }
        - { scenario_id: SCN-002, invariant_ids: [INV-001, INV-002] }
        - { scenario_id: SCN-003, invariant_ids: [INV-001, INV-003] }
        - { scenario_id: SCN-004, invariant_ids: [INV-004] }
        - { scenario_id: SCN-005, invariant_ids: [INV-005] }
        - { scenario_id: SCN-006, invariant_ids: [INV-001, INV-002, INV-003, INV-005] }
    scenario_to_test_expectations:
        - { scenario_id: SCN-001, test_expectation_ids: [TEXP-001] }
        - { scenario_id: SCN-002, test_expectation_ids: [TEXP-002] }
        - { scenario_id: SCN-003, test_expectation_ids: [TEXP-003] }
        - { scenario_id: SCN-004, test_expectation_ids: [TEXP-001] }
        - { scenario_id: SCN-005, test_expectation_ids: [TEXP-004] }
        - { scenario_id: SCN-006, test_expectation_ids: [TEXP-001, TEXP-004] }
