    - { id: TEXP-275-001, category: security, classification: REQUIRED, reason: "Field-level role privacy and identifier protection need access-attempt tests.", scenarios: [SCN-275-001] }
    - { id: TEXP-275-002, category: integration, classification: REQUIRED, reason: "Failure/retry/recovery behavior spans all Corporate side-effect boundaries.", scenarios: [SCN-275-002, SCN-275-003] }
    - { id: TEXP-275-003, category: business_uat, classification: REQUIRED, reason: "Operators must validate recovery ownership and audit evidence.", scenarios: [SCN-275-003] }
