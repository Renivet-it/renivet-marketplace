requirements:
    - { id: REQ-275-001, description: "Enforce field-level visibility for buyer, brand, and Renivet/admin roles and use opaque employee identifiers.", type: security }
    - { id: REQ-275-002, description: "Make every Corporate side-effect boundary expose an explicit completed, failed-closed, or recovery-required state.", type: recovery }
    - { id: REQ-275-003, description: "Provide retry/compensation/reconciliation paths with operator-visible audit evidence and no apparent success without persisted records.", type: operational }
scenarios:
    - { id: SCN-275-001, description: "Brand access returns only fulfilment-required fields and cannot infer employee identity from identifiers.", requirement_ids: [REQ-275-001], test_expectation_ids: [TEXP-275-001] }
    - { id: SCN-275-002, description: "Payment/order/QC/document/shipping/settlement partial failure becomes explicit recovery-required or failed-closed.", requirement_ids: [REQ-275-002, REQ-275-003], test_expectation_ids: [TEXP-275-002] }
    - { id: SCN-275-003, description: "Authorized retry/reconciliation completes once and records audit evidence without duplicate economic effects.", requirement_ids: [REQ-275-003], test_expectation_ids: [TEXP-275-002, TEXP-275-003] }
invariants:
    - { id: INV-275-001, description: "A role cannot read fields outside its approved Corporate visibility matrix." }
    - { id: INV-275-002, description: "Required persisted business records exist before UI/API reports success." }
    - { id: INV-275-003, description: "Recovery/retry is idempotent, authorized, observable, and does not duplicate economic effects." }
flows:
    - { id: FLOW-275-001, description: "Role-authorized Corporate projection returns minimized fields and opaque identifiers.", state_transitions: [started, completed, failed_closed] }
    - { id: FLOW-275-002, description: "Side-effect failure records recovery-required state and authorized retry converges.", state_transitions: [started, recovery_required, retrying, recovered] }
dependencies:
    - { id: DEP-275-001, name: REN-262, purpose: "Payment recovery boundary", description: "Shared idempotent reconciliation and operator recovery.", status: resolved }
    - { id: DEP-275-002, name: REN-269/270/271, purpose: "Downstream recovery boundaries", description: "Settlement, document, and fulfilment state machines.", status: resolved }
integrations: [{ id: INT-275-001, system: Corporate services, purpose: "Cross-cutting recovery and projections", name: payment/order/QC/document/shipping/settlement, contract: "Every boundary has explicit persisted outcome.", failure_mode: "Failed closed or recovery_required with audit evidence." }]
personas: [{ id: PER-275-001, name: brand user, role: seller, applicability: "Sees only required fulfilment information." }, { id: PER-275-002, name: Renivet operator, role: operator, applicability: "Performs authorized recovery." }]
security_boundaries: [{ id: SEC-275-001, description: "Role and tenant authorization is enforced server-side for every field projection." }, { id: SEC-275-002, description: "Opaque identifiers prevent trivial employee identity reconstruction." }, { id: SEC-275-003, description: "Recovery actions require explicit operator permission and audit context." }]
business_rules: [{ id: BR-275-001, description: "No apparent success without the required persisted business outcome." }]
