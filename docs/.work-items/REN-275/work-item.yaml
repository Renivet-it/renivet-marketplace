risk: { initial_risk: L3, path_rule_risk: L3, semantic_risk: L3, final_risk: L3, reasons: ["Role/tenant privacy boundaries expose confidential Corporate data.", "Failure state changes span financial and operational workflows."], escalation_history: [] }
