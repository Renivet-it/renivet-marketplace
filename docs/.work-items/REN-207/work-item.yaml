    requirement_to_scenarios:
        - { requirement_id: REQ-207-001, scenario_ids: [SCN-207-001] }
        - { requirement_id: REQ-207-002, scenario_ids: [SCN-207-001, SCN-207-002] }
        - { requirement_id: REQ-207-003, scenario_ids: [SCN-207-002, SCN-207-003] }
