    scenario_to_invariants:
        - { scenario_id: SCN-207-001, invariant_ids: [INV-207-001] }
        - { scenario_id: SCN-207-002, invariant_ids: [INV-207-002] }
        - { scenario_id: SCN-207-003, invariant_ids: [INV-207-002] }
        - { scenario_id: SCN-207-004, invariant_ids: [INV-207-003] }
        - { scenario_id: SCN-207-005, invariant_ids: [INV-207-004] }
        - { scenario_id: SCN-207-006, invariant_ids: [INV-207-001] }
        - { scenario_id: SCN-207-007, invariant_ids: [INV-207-004] }
    scenario_to_test_expectations:
        - { scenario_id: SCN-207-001, test_expectation_ids: [TEXP-207-001] }
        - { scenario_id: SCN-207-002, test_expectation_ids: [TEXP-207-001] }
        - { scenario_id: SCN-207-003, test_expectation_ids: [TEXP-207-001] }
        - { scenario_id: SCN-207-004, test_expectation_ids: [TEXP-207-001] }
        - { scenario_id: SCN-207-005, test_expectation_ids: [TEXP-207-001] }
        - { scenario_id: SCN-207-006, test_expectation_ids: [TEXP-207-001] }
        - { scenario_id: SCN-207-007, test_expectation_ids: [TEXP-207-002] }
