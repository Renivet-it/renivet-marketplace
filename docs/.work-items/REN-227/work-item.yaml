        - { scenario_id: SCN-227-005, invariant_ids: [INV-227-001, INV-227-002] }
        - { scenario_id: SCN-227-006, invariant_ids: [INV-227-004, INV-227-006] }
        - { scenario_id: SCN-227-007, invariant_ids: [INV-227-003, INV-227-006] }
        - { scenario_id: SCN-227-008, invariant_ids: [INV-227-005] }
