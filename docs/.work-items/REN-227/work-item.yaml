    - { id: TEXP-227-002, category: integration, classification: REQUIRED, reason: "Verify qualifying Delhivery issuance, customer download, and admin visibility.", scenarios: [SCN-227-002, SCN-227-007] }
    - { id: TEXP-227-003, category: integration, classification: REQUIRED, reason: "Verify qualifying Shiprocket issuance converges on the authoritative order reference without breaking carrier behavior.", scenarios: [SCN-227-003] }
    - { id: TEXP-227-004, category: regression, classification: REQUIRED, reason: "Verify non-qualifying order states remain without an invoice according to the approved matrix.", scenarios: [SCN-227-004] }
    - { id: TEXP-227-005, category: regression, classification: REQUIRED, reason: "Verify concurrent retries, uniqueness, existing-number return, and no overwrite.", scenarios: [SCN-227-005] }
    - { id: TEXP-227-006, category: business_uat, classification: REQUIRED, reason: "Verify controlled post-fix population, redacted failure evidence, unchanged history, and customer/admin availability.", scenarios: [SCN-227-006, SCN-227-007, SCN-227-008, SCN-227-009] }
