    scenario_to_test_expectations:
        - {scenario_id: SCN-001, test_expectation_ids: [TEXP-002]}
        - {scenario_id: SCN-002, test_expectation_ids: [TEXP-002]}
        - {scenario_id: SCN-003, test_expectation_ids: [TEXP-003]}
        - {scenario_id: SCN-004, test_expectation_ids: [TEXP-001, TEXP-004]}
        - {scenario_id: SCN-005, test_expectation_ids: [TEXP-005]}
        - {scenario_id: SCN-006, test_expectation_ids: [TEXP-006]}
        - {scenario_id: SCN-007, test_expectation_ids: [TEXP-007]}
        - {scenario_id: SCN-008, test_expectation_ids: [TEXP-001]}
