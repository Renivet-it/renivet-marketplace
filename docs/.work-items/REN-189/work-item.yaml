critic:
    required: true
    completed: true
    artifact: CRITIQUE.md
    reviewer: independent_codex_critic
    fresh_context: true
    read_only: true
    categories_reviewed:
        - requirements_scenarios
        - failure_recovery
        - security_privacy
        - state_data_consistency
        - integrations_idempotency
        - compatibility_migration
        - observability_testability
        - assumptions_dependencies
    findings:
        - {id: D-001, severity: DESIGN_BLOCKER, summary: New CAPI logging conflicted with raw PII persistence, status: resolved_in_contract, disposition: Defined safe persisted userData/customData/provider projections, legacy read/export redaction, and security tests in REQ-007, INV-005, SCN-009, TEXP-008/009.}
        - {id: D-002, severity: DESIGN_BLOCKER, summary: Governance traceability and SPEC/YAML test IDs were inconsistent, status: resolved_in_contract, disposition: Reconciled test IDs and added explicit flow_to_test_expectations mappings.}
        - {id: M-001, severity: MAJOR, summary: Production rollout flag and fail behavior were unspecified, status: resolved_in_contract, disposition: Defined META_CAPI_SUPPRESS_CRAWLERS, disabled-by-default on missing/read failure, explicit operator enablement, and fail-open uncertain-agent behavior.}
        - {id: M-002, severity: MAJOR, summary: Stable event IDs did not establish application-level duplicate behavior, status: resolved_in_contract, disposition: Defined ownership/lifetime for request/action/Purchase IDs, deterministic completed-order Purchase IDs, Meta deduplication, and unique operational counting.}
        - {id: M-003, severity: MAJOR, summary: fbclid/fbc capture and one-time hashing boundary were underspecified, status: resolved_in_contract, disposition: Defined _fbc precedence, consent-eligible fbclid conversion format, no fabrication, and separate raw-identifier versus personal-field handling.}
approval:
    state: BLOCKED
    design_blockers:
        - Stakeholder confirmation is required for high-consequence raw-PII log redaction and legacy dashboard/export treatment (DEC-004/DEC-006).
        - Stakeholder confirmation is required for deterministic Purchase event-ID ownership and same-order retry behavior (DEC-005).
        - Meta Events Manager Test Events and Search Console/URL Inspection access must be confirmed before READY_FOR_DEV.
    approved_by: null
