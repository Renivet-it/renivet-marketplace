    - { id: TEXP-265-002, category: integration, classification: REQUIRED, reason: "Scope/allocation and DB uniqueness require persistence evidence.", scenarios: [SCN-265-002, SCN-265-003] }
    - { id: TEXP-265-003, category: regression, classification: REQUIRED, reason: "Direct and PO order creation must preserve one-order behavior.", scenarios: [SCN-265-003] }
