requirements:
    - { id: REQ-265-001, description: "Enforce quote lifecycle, expiry, immutable approved revision, and buyer/company ownership.", type: safety }
    - { id: REQ-265-002, description: "Validate normalized PO product/SKU/configuration and quantity/employee/size allocation against the approved quote.", type: financial }
    - { id: REQ-265-003, description: "Enforce race-safe numbering and at most one economic Corporate order per approved quote transaction.", type: integrity }
scenarios:
    - { id: SCN-265-001, description: "Only an approved, unexpired, same-company quote creates an order.", requirement_ids: [REQ-265-001], test_expectation_ids: [TEXP-265-001] }
    - { id: SCN-265-002, description: "Material revision requires re-approval and stale revision/PO is rejected.", requirement_ids: [REQ-265-001, REQ-265-002], test_expectation_ids: [TEXP-265-001, TEXP-265-002] }
    - { id: SCN-265-003, description: "Wrong scope/allocation and concurrent duplicate PO/order attempts fail or converge to one order.", requirement_ids: [REQ-265-002, REQ-265-003], test_expectation_ids: [TEXP-265-002, TEXP-265-003] }
invariants:
    - { id: INV-265-001, description: "Approved commercial versions are immutable and ownership-bound." }
    - { id: INV-265-002, description: "PO scope and allocation cannot exceed or diverge from approved quote economics." }
    - { id: INV-265-003, description: "One approved quote transaction creates at most one economic order." }
flows:
    - { id: FLOW-265-001, description: "Draft quote becomes approved immutable revision and is accepted only by its owner/company before expiry.", state_transitions: [draft, approved, po_accepted] }
    - { id: FLOW-265-002, description: "Validated PO creates one order with an approved commercial snapshot.", state_transitions: [po_accepted, order_created] }
dependencies:
