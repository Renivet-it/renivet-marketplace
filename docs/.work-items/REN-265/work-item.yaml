risk: { initial_risk: L3, path_rule_risk: L3, semantic_risk: L3, final_risk: L3, reasons: ["Commercial amounts and buyer ownership affect orders and payment.", "Quote/PO races can create duplicate economic orders."], escalation_history: [] }
