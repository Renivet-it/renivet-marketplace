integrations: [{ id: INT-265-001, system: PostgreSQL, purpose: "Atomic ownership and uniqueness", name: Corporate database, contract: "Checks and order creation share a transaction.", failure_mode: "Conflict fails closed without duplicate order." }]
personas: [{ id: PER-265-001, name: corporate buyer, role: customer, applicability: "Owns company quote and submits PO." }, { id: PER-265-002, name: finance administrator, role: finance administrator, applicability: "Approves commercial version." }]
security_boundaries: [{ id: SEC-265-001, description: "Company ownership is checked server-side." }, { id: SEC-265-002, description: "Client price/product/allocation fields cannot override approved snapshots." }]
business_rules: [{ id: BR-265-001, description: "Approved quote economics are the sole basis for order creation." }]
decisions:
