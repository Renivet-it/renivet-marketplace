          invariant_ids: [INV-154-001, INV-154-002, INV-154-003]
        - scenario_id: SCN-154-003
          invariant_ids: [INV-154-001, INV-154-003, INV-154-004]
        - scenario_id: SCN-154-004
          invariant_ids: [INV-154-003, INV-154-004]
    scenario_to_test_expectations:
        - scenario_id: SCN-154-001
          test_expectation_ids: [TEXP-154-001]
        - scenario_id: SCN-154-002
          test_expectation_ids: [TEXP-154-001, TEXP-154-004]
        - scenario_id: SCN-154-003
          test_expectation_ids: [TEXP-154-002, TEXP-154-004]
        - scenario_id: SCN-154-004
          test_expectation_ids: [TEXP-154-002, TEXP-154-003, TEXP-154-004]
