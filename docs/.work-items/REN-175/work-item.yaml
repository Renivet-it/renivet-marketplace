    requirement_to_scenarios:
        - requirement_id: REQ-001
          scenario_ids: [SCN-001, SCN-002, SCN-003, SCN-005, SCN-006]
        - requirement_id: REQ-002
          scenario_ids: [SCN-001, SCN-002, SCN-003]
        - requirement_id: REQ-003
          scenario_ids: [SCN-003, SCN-004]
        - requirement_id: REQ-004
          scenario_ids: [SCN-001, SCN-002]
        - requirement_id: REQ-005
          scenario_ids: [SCN-005, SCN-006]
        - requirement_id: REQ-006
          scenario_ids: [SCN-008]
    scenario_to_invariants:
        - scenario_id: SCN-001
          invariant_ids: [INV-001, INV-002]
        - scenario_id: SCN-002
          invariant_ids: [INV-001, INV-002]
        - scenario_id: SCN-003
          invariant_ids: [INV-001, INV-002, INV-003]
        - scenario_id: SCN-004
          invariant_ids: [INV-003]
        - scenario_id: SCN-005
          invariant_ids: [INV-004]
        - scenario_id: SCN-006
          invariant_ids: [INV-004]
        - scenario_id: SCN-007
          invariant_ids: [INV-001, INV-002]
        - scenario_id: SCN-008
          invariant_ids: [INV-004, INV-005]
    scenario_to_test_expectations:
        - scenario_id: SCN-001
          test_expectation_ids: [TEXP-001]
        - scenario_id: SCN-002
          test_expectation_ids: [TEXP-002]
        - scenario_id: SCN-003
          test_expectation_ids: [TEXP-003]
        - scenario_id: SCN-004
          test_expectation_ids: [TEXP-003]
        - scenario_id: SCN-005
          test_expectation_ids: [TEXP-004]
        - scenario_id: SCN-006
          test_expectation_ids: [TEXP-004]
        - scenario_id: SCN-007
          test_expectation_ids: [TEXP-001, TEXP-003]
        - scenario_id: SCN-008
          test_expectation_ids: [TEXP-005]
