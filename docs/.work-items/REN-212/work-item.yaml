    requirement_to_scenarios:
        - { requirement_id: REQ-212-001, scenario_ids: [SCN-212-001, SCN-212-002] }
        - { requirement_id: REQ-212-002, scenario_ids: [SCN-212-001] }
        - { requirement_id: REQ-212-003, scenario_ids: [SCN-212-003] }
        - { requirement_id: REQ-212-004, scenario_ids: [SCN-212-002, SCN-212-004] }
        - { requirement_id: REQ-212-005, scenario_ids: [SCN-212-002, SCN-212-003, SCN-212-005] }
        - { requirement_id: REQ-212-006, scenario_ids: [SCN-212-005] }
        - { requirement_id: REQ-212-007, scenario_ids: [SCN-212-006] }
    scenario_to_invariants:
        - { scenario_id: SCN-212-001, invariant_ids: [INV-212-002, INV-212-004] }
        - { scenario_id: SCN-212-002, invariant_ids: [INV-212-001, INV-212-002] }
        - { scenario_id: SCN-212-003, invariant_ids: [INV-212-003] }
        - { scenario_id: SCN-212-004, invariant_ids: [INV-212-004] }
        - { scenario_id: SCN-212-005, invariant_ids: [INV-212-001, INV-212-005] }
        - { scenario_id: SCN-212-006, invariant_ids: [INV-212-004, INV-212-005] }
    scenario_to_test_expectations:
        - { scenario_id: SCN-212-001, test_expectation_ids: [TEXP-212-001] }
        - { scenario_id: SCN-212-002, test_expectation_ids: [TEXP-212-001, TEXP-212-002] }
        - { scenario_id: SCN-212-003, test_expectation_ids: [TEXP-212-002] }
        - { scenario_id: SCN-212-004, test_expectation_ids: [TEXP-212-001] }
        - { scenario_id: SCN-212-005, test_expectation_ids: [TEXP-212-002] }
        - { scenario_id: SCN-212-006, test_expectation_ids: [TEXP-212-003] }
