        - { requirement_id: REQ-203-003, scenario_ids: [SCN-203-002, SCN-203-004] }
        - { requirement_id: REQ-203-004, scenario_ids: [SCN-203-001, SCN-203-002] }
        - { requirement_id: REQ-203-005, scenario_ids: [SCN-203-003, SCN-203-008] }
        - { requirement_id: REQ-203-006, scenario_ids: [SCN-203-005] }
        - { requirement_id: REQ-203-007, scenario_ids: [SCN-203-006, SCN-203-007] }
        - { requirement_id: REQ-203-008, scenario_ids: [SCN-203-006, SCN-203-008] }
    scenario_to_invariants:
        - { scenario_id: SCN-203-001, invariant_ids: [INV-203-001, INV-203-002] }
