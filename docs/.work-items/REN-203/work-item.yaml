        - { scenario_id: SCN-203-003, invariant_ids: [INV-203-001, INV-203-002, INV-203-005] }
        - { scenario_id: SCN-203-004, invariant_ids: [INV-203-002] }
        - { scenario_id: SCN-203-005, invariant_ids: [INV-203-005] }
        - { scenario_id: SCN-203-006, invariant_ids: [INV-203-001, INV-203-003, INV-203-004] }
        - { scenario_id: SCN-203-007, invariant_ids: [INV-203-003, INV-203-004] }
        - { scenario_id: SCN-203-008, invariant_ids: [INV-203-005] }
    scenario_to_test_expectations:
        - { scenario_id: SCN-203-001, test_expectation_ids: [TEXP-203-001] }
