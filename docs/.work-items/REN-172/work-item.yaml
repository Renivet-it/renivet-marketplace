invariants:
  - id: INV-001
    description: For every one of the 51 procedures, a brand-A caller supplying brand-B's id as the target resource never causes a read or write against brand-B's data
    source_derivation: qa/CROSS_TENANT_AUTHORIZATION_AUDIT.md; PAT-TENANT-01
    validation_strategy: "Automated test per procedure: authenticate as brand-A admin, call with input.brandId = brand-B, assert FORBIDDEN and assert no brand-B row was read/written (verified via DB query or mock assertion, per procedure)"
    affected_scenarios:
      - SCN-001
      - SCN-002
    status: pending
  - id: INV-002
    description: No sequence of currently-available brand-scoped procedure calls allows a brand-A user to obtain ADMINISTRATOR-equivalent permissions over brand B
    source_derivation: qa/FINDINGS/DEFECT_RECORDS.md DEF-010 update — the roles.ts + members.ts chained escalation
    validation_strategy: "Automated integration test: as brand-A admin, attempt the full chain (createRole targeting brand B's id with ADMINISTRATOR bit, then updateRoles binding it to a brand-B user); assert the chain is broken at the first step and cannot be completed even if attempted out of order"
    affected_scenarios:
      - SCN-003
    status: pending
  - id: INV-003
    description: confidential.ts's write procedures never fire an external side effect (Shiprocket/Delhivery warehouse creation, verification email) using attacker-supplied data against a brand the caller does not own
    source_derivation: qa/FINDINGS/DEFECT_RECORDS.md DEF-010 update; PAT-EXTSTATE-01 (external side effects must not proceed on an unverified state)
    validation_strategy: "Automated test: attempt createConfidential cross-brand; assert both the DB write AND the external API call are never reached (mock the external client and assert zero invocations)"
    affected_scenarios:
      - SCN-004
    status: pending
  - id: INV-004
    description: "REVISED (Critic Cycle 1): the fix's COMPARISON logic (resolved-brand-id !== ctx.user.brand?.id) is textually and behaviorally identical across all 51 procedures via one shared utility call — but the RESOLUTION of which brand id to pass into that comparison is necessarily per-procedure (direct from input, or via an existing lookup already present in that procedure), per REQ-008's classification. No procedure receives a bespoke, subtly-different COMPARISON — resolution differing by necessity is not the same defect PAT-CONTRACT-01 warns against."
    source_derivation: PAT-CONTRACT-01 — a shared-contract fix applied inconsistently across call sites is this codebase's own DEF-003 failure class, reused here as a design constraint. REVISED after Critic Cycle 1 found the original one-flat-signature framing didn't generalize to resolved-brandId sites.
    validation_strategy: Code review + a shared, reusable comparison helper (not 51 hand-written inline comparisons) enforced via a lint rule or a shared `requireOwnBrand(ctx, resolvedBrandId)` utility; automated test asserts the utility itself is called at each of the 51 sites with SOME resolved brand id (grep-based structural test acceptable given zero test framework currently exists), plus a per-class manual/code-review check that each RESOLVED-class site's resolution logic actually derives from the same lookup already used for NOT_FOUND handling in that procedure, not a new, separately-fallible lookup
    affected_scenarios:
      - SCN-005
    status: pending
  - id: INV-005
    description: A legitimate platform administrator (isAdmin) retains the ability to act cross-brand where that is an intended, already-existing capability; the fix does not silently break existing admin tooling
    source_derivation: Existing correct pattern in products.ts uses `!isAdmin` alongside the ownership check — this SPEC must preserve that, not just add a blanket check. Critic Cycle 1 confirmed isAdmin's definition is identical everywhere checked (trpc.ts:140-142, products.ts:515,1157,1742,1802).
    validation_strategy: "Automated test: authenticate as platform admin, call each of a sample of the 51 procedures cross-brand, assert success (not FORBIDDEN)"
    affected_scenarios:
      - SCN-006
    status: pending
  - id: INV-006
    description: "ADDED (Critic Cycle 1): a legitimate same-brand caller (their own brandId matches the target) continues to succeed on every one of the 51 procedures after the fix — the fix rejects cross-brand only, never same-brand"
    source_derivation: Critic Cycle 1 finding (happy_path, non-blocking) — no scenario asserted the ordinary positive case; SCN-006 only tests the admin-bypass path, not an everyday same-brand user's own call
    validation_strategy: "Automated test per procedure (or a representative sample): authenticate as brand-A admin, call with input.brandId = brand-A (own brand); assert success, not FORBIDDEN"
    affected_scenarios:
      - SCN-010
    status: pending
flows:
  - id: FLOW-001
    description: "N/A — no state to reconcile; this is a pure access-control fix with no async/eventual-consistency dimension. The three-domain model is included per PAT-EXTSTATE-01's letter (external systems ARE involved via confidential.ts/Unicommerce) but its content here is 'never call the external system before the ownership check', not a sync/reconciliation pipeline. Failure handling: N/A in the traditional retry/timeout sense — this is an authorization gate, not a data-sync flow. The relevant 'failure handling' is: a rejected (FORBIDDEN) call must not have already fired any external side effect (Shiprocket/Delhivery/email) before the ownership check runs — the check must be the first thing each procedure does after authentication, before any DB read of the target brand or external call."
    state_transitions: &a1
      - None — this is an authorization-gate fix, not a data state-machine change. No new states are introduced.
dependencies:
  - id: DEP-001
    description: "None blocking — this issue has no external prerequisite. It is explicitly recommended to proceed immediately regardless of P08's authorization status (Gate F: 'F10's fix (via DEF-010) is the one piece of P08 that should start immediately')"
    status: resolved
    type: INFORMATIONAL_DEPENDENCY
