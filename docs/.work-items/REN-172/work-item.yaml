schema_version: "1.0"
task:
  id: REN-172
  title: Cross-tenant authorization bypass across 51 brand-router procedures (includes F10's 6 Unicommerce procedures)
  source: linear
  branch: akshayatwork1/ren-172-cross-tenant-authorization-bypass-across-51-brand-router
  status: READY_FOR_DEV
  linear:
    url: https://linear.app/renivet/issue/REN-172
risk:
  initial_risk: L3
  initial_risk_source: preliminary_ai
  path_rule_risk: L3
  semantic_risk: L3
  final_risk: L3
  path_rule_matches:
    - path: src/lib/trpc/routes/brands/**
      policy_rule: tenant-isolation
    - path: src/lib/trpc/routes/brands/confidential.ts
      policy_rule: customer-pii
  escalation_history: []
requirements:
  - id: REQ-001
    description: Every one of the 51 identified procedures must reject a caller whose own brand does not match the procedure's target input.brandId (or equivalent resolved brand-scoped resource), except for a legitimate platform-admin bypass
    type: explicit
    source: REN-172/DEF-010 acceptance criteria (Linear)
  - id: REQ-002
    description: roles.ts's createRole/updateRole must not allow a brand admin to write a permission bitfield for a role belonging to a brand other than their own
    type: inferred
    source: qa/FINDINGS/DEFECT_RECORDS.md DEF-010 update (2026-08-24) — privilege-escalation chain
  - id: REQ-003
    description: members.ts's roles.updateRoles must not allow binding a role to a user in a brand other than the caller's own
    type: inferred
    source: qa/FINDINGS/DEFECT_RECORDS.md DEF-010 update (2026-08-24) — privilege-escalation chain, second link
  - id: REQ-004
    description: getBrandWithConfidential and confidential.ts's create/update procedures must reject any caller whose own brand does not match the target brandId, before any KYC/legal/bank data is read or any external side-effect (Shiprocket/Delhivery warehouse creation, verification email) is fired
    type: inferred
    source: qa/FINDINGS/DEFECT_RECORDS.md DEF-010 update — zero-auth confidential-data finding
  - id: REQ-005
    description: analytics.ts's getOverview/getMonthlySales/getStatusBreakdown/getTopProducts and orders.ts's getOrderShipmentDetailsByShipmentId must reject a caller requesting another brand's data
    type: inferred
    source: qa/FINDINGS/DEFECT_RECORDS.md DEF-010 update — zero-auth analytics/shipment leak finding
  - id: REQ-006
    description: The 6 Unicommerce procedures (getUnicommerceIntegration, upsertUnicommerceIntegration, authenticateUnicommerceIntegration, runUnicommerceApiRequest, testUnicommerceIntegration, triggerUnicommerceSync) must reject cross-brand calls, satisfying P08's AC-31 as a byproduct
    type: inferred
    source: F10 (docs/research/brand-commerce-integration/01-renivet-current-state/FINDINGS.md); original DEF-010 finding
  - id: REQ-007
    description: "REVISED (Critic Cycle 1): products.ts's 6 vulnerable procedures need two different remediations, not one uniform 'restore the comment' fix. Only `updateProductPublishStatus` (~line 1379) has a commented-out ownership check with no active replacement — a genuine regression restoration. The other two commented blocks (in `updateProduct`/`deleteProduct`) are dead code already superseded by working active checks a few lines later — those two procedures are already safe, no change needed. Five procedures — `updateCatalogQcReview`, `createProductJourney`, `updateProductJourney`, `createProductValue`, `updateProductValue` — have NO ownership check ever present, commented or otherwise, and need genuinely NEW authorization logic (two of them via nested-id resolution, since they identify their target by a journey/value id, not a brandId)."
    type: inferred
    source: "Architect investigation, 2026-08-31 — verified at src/lib/trpc/routes/brands/products.ts (commented `if (existingProduct.brand.id !== user.brand?.id)` blocks at lines 1152, 1362, 1379, 1737, among others). CORRECTED after Critic Cycle 1 (2026-08-31): independent verification found only updateProductPublishStatus (1379-1383) is a true restoration; updateProduct (1152-1156) and deleteProduct (1737-1741)'s commented blocks are dead/superseded by active checks at 1166-1174/1746; updateCatalogQcReview (1620-1652), createProductJourney/updateProductJourney (1858-1911), createProductValue/updateProductValue (1913-1963) have no check at all and need new code. The original text would have led an implementer to under-scope 5 of 6 vulnerable products.ts procedures as 'just restore a comment.'"
  - id: REQ-008
    description: "REVISED (Critic Cycle 2): the fix must classify all 51 procedures into (a) DIRECT sites — target brandId is present on `input` — where a shared `requireOwnBrand(ctx, input.brandId)` call suffices, and (b) RESOLVED sites — target brand is only knowable after a lookup — where the same shared comparison is called with that resolved brand id instead. Corrected classification: `brand-pages.ts`'s `createBrandPageSection` is Class A (DIRECT — `const { brandId } = input` at line ~150), not Class B as Revision 1 claimed; its other 5 procedures remain Class B via an existing section/product lookup. `products.ts`'s `updateProductJourney`/`updateProductValue` are Class B but REQUIRE A NEW SECOND QUERY (fetch the journey/value row by id — which has no brand reference at all, only a productId FK — then fetch that product to reach `.brand.id`); this is NOT a 'reuse an existing read' case like the other Class B sites, and must be implemented as an explicit second lookup, not assumed free. `invites.ts`'s `getInvite` ({code} only, no brandId, no isTRPCAuth at all) is a 10th confirmed Class B site, resolved via `queries.brandInvites.getBrandInvite(code)`'s return value — found during Cycle 2's spot-check of exactly the files DEC-001 already flagged as unverified, corroborating that concern with concrete evidence. ADDED (Critic Cycle 3): three more products.ts procedures belong in the Class B 'reuse an existing read' list, previously omitted by bookkeeping oversight — `createProductJourney`, `createProductValue`, and `updateCatalogQcReview` (products.ts:1620-1652, 1858-1939) all already fetch `existingProduct = queries.products.getProduct({productId: input.productId})` before anything else, and `getProduct` joins the brand relation, so `existingProduct.brand.id` is already available with no new query — same pattern as the other reuse-based Class B sites, just not previously listed. The full classification (now 13 named Class B sites) is a floor to be confirmed procedure-by-procedure at implementation time, not asserted as exhaustive by this SPEC."
    type: inferred
    source: "Critic Cycle 1 finding (authorization, blocking) — verified >=9 of the 51 sites have no input.brandId at all. REVISED after Critic Cycle 2 (2026-08-31) re-verified every named site against origin/master and found: (1) createBrandPageSection misclassified — its cited lines 27-34 actually belong to a different procedure (createBrandPageSectionProduct); (2) updateProductJourney/updateProductValue's underlying tables (productsJourney/productValues, product.ts schema lines 527-544/573-587) have no brand reference, only productId — the 'no new query' claim was false for these 2; (3) invites.ts::getInvite is an additional, previously-unlisted Class B site in an unverified file."
  - id: REQ-009
    description: "REVISED (Critic Cycle 2): rejected cross-brand attempts (FORBIDDEN from the new ownership check) are logged/alerted via the existing `createOperationalAlert` helper (src/lib/monitoring-sla/audit.ts:41, already used elsewhere in products.ts) so repeated post-deploy probing of the newly-closed brand-takeover chain can be detected during rollout. Concrete convention (added per Cycle 2, so all 51+ call sites are consistent rather than each inventing its own): `entityType: 'brand'`, `entityId: <the target brandId that was rejected>`, `dedupeKey: cross_brand_rejection:{procedureName}:{callerUserId}:{targetBrandId}` (leverages the helper's built-in dedup support), `type: 'cross_brand_rejection'` (ADDED per Critic Cycle 3 — the helper also accepts a `type` field, defaulting to the generic `'operational_event'` if omitted, which would make these 51+ call sites' alerts hard to distinguish as one signal on a dashboard; existing usage elsewhere in products.ts always sets `type` explicitly, e.g. `'catalog_qc_escalation'`), `severity` at a level appropriate for a security-probing signal (developer to confirm against the helper's existing severity taxonomy)."
    type: inferred
    source: "Critic Cycle 1 finding (observability, non-blocking) — no requirement/scenario proposed detection of repeated cross-brand rejection attempts for a P0 fix closing an actively-probeable full brand-takeover chain. REVISED after Critic Cycle 2: confirmed createOperationalAlert's real signature and dedup mechanism, and found the original requirement left entityType/entityId/dedupeKey unspecified — risking the same per-call-site inconsistency the comparison-logic fix itself was designed to avoid."
scenarios:
  - id: SCN-001
    requirement_ids:
      - REQ-001
    description: "Generic cross-tenant check: for a representative sample spanning all affected files, brand-A admin calls with input.brandId = brand-B; assert FORBIDDEN and zero brand-B data read/written. The Linear issue's own 'Required TEST' already calls for this per all 51 procedures — this scenario is the shared template each of the 51 tests instantiates."
    category: authorization
    invariant_ref: INV-001
    verification:
      type: automated
      test_ref: brands.ownership.spec.ts::cross-tenant-rejected[51 procedures, table-driven]
      reason_code: null
      reason: null
    status: pending
  - id: SCN-002
    requirement_ids:
      - REQ-006
    description: "The 6 F10 Unicommerce procedures specifically: brand-A admin cannot read/write brand-B's Unicommerce credentials or trigger a sync against brand-B's tenant"
    category: tenant_isolation
    invariant_ref: INV-001
    verification:
      type: automated
      test_ref: brands.unicommerce.ownership.spec.ts::cross-tenant-rejected
      reason_code: null
      reason: null
    status: pending
  - id: SCN-003
    requirement_ids:
      - REQ-002
    description: "Full privilege-escalation chain attempt: brand-A admin calls createRole targeting brand B with an ADMINISTRATOR bit, then attempts members.roles.updateRoles to bind it to a brand-B user; assert the chain is broken at createRole (first call already FORBIDDEN), not merely at the second step"
    category: authorization
    invariant_ref: INV-002
    verification:
      type: security
      test_ref: null
      reason_code: SECURITY_SPECIALIST_REQUIRED
      reason: This is a multi-step exploit-chain verification (privilege escalation), which per qa/PERSONAS/APPLICABILITY_MATRIX.md is Persona 2's (Application Security Engineer) primary domain — beyond a simple single-call pass/fail assertion, it needs adversarial-chain thinking to confirm no alternate ordering or partial-state path re-opens the chain
    status: pending
  - id: SCN-004
    requirement_ids:
      - REQ-004
    description: "createConfidential called cross-brand: assert the ownership check rejects before any Shiprocket/Delhivery warehouse-creation call or verification email is sent (mock the external clients, assert zero invocations on the rejected path)"
    category: external_dependency_failures
    invariant_ref: INV-003
    verification:
      type: automated
      test_ref: brands.confidential.ownership.spec.ts::cross-tenant-rejected-no-side-effects
      reason_code: null
      reason: null
    status: pending
  - id: SCN-005
    requirement_ids:
      - REQ-007
    description: Structural check that all 51 procedures call one shared ownership-check utility rather than 51 independent inline implementations, and that products.ts's commented-out checks are restored, not left commented
    category: data_integrity
    invariant_ref: INV-004
    verification:
      type: automated
      test_ref: structural.ownership-check-coverage.spec.ts
      reason_code: null
      reason: null
    status: pending
  - id: SCN-006
    requirement_ids:
      - REQ-001
    description: Platform admin (isAdmin) calling any of a representative sample of the 51 procedures cross-brand still succeeds — the fix must not regress legitimate admin tooling
    category: backward_compatibility
    invariant_ref: INV-005
    verification:
      type: automated
      test_ref: brands.ownership.spec.ts::admin-bypass-preserved
      reason_code: null
      reason: null
    status: pending
  - id: SCN-007
    requirement_ids:
      - REQ-005
    description: analytics.ts and orders.ts's getOrderShipmentDetailsByShipmentId cannot be used by an authenticated non-brand-member (e.g. an ordinary shopper account) to pull another brand's revenue data or a customer's shipment/address PII by id
    category: pii
    invariant_ref: INV-001
    verification:
      type: automated
      test_ref: brands.analytics-and-shipment.pii.spec.ts::non-brand-user-rejected
      reason_code: null
      reason: null
    status: pending
  - id: SCN-008
    requirement_ids:
      - REQ-002
    description: Two concurrent requests — one legitimate brand-A role update, one attacker cross-brand attempt — must not interleave in a way that lets the ownership check on one request read stale ctx.user.brand state affected by the other
    category: race_conditions
    invariant_ref: INV-002
    verification:
      type: manual
      test_ref: null
      reason_code: MANUAL_BUSINESS_VALIDATION_REQUIRED
      reason: ctx.user.brand is resolved per-request from the authenticated session at request time, not shared mutable state across requests, per this codebase's existing tRPC context pattern — this scenario's risk is judged LOW by design inspection rather than warranting a dedicated concurrency test; a security reviewer should confirm this judgment rather than an automated test being written for a risk that structurally shouldn't exist
    status: pending
  - id: SCN-009
    requirement_ids:
      - REQ-003
    description: "members.ts's roles.updateRoles rejected on its own (independent of the chain in SCN-003): brand-A admin attempts to bind ANY existing role (not just a freshly-created hostile one) to a user in brand B — assert FORBIDDEN regardless of which role is targeted"
    category: authorization
    invariant_ref: INV-002
    verification:
      type: automated
      test_ref: brands.members.ownership.spec.ts::cross-tenant-role-binding-rejected
      reason_code: null
      reason: null
    status: pending
  - id: SCN-010
    requirement_ids:
      - REQ-008
    description: "REVISED (Critic Cycle 2): for each of the 10 confirmed RESOLVED-class procedures (members.ts roles.updateRoles, orders.ts getOrderShipmentDetailsByShipmentId, 5 of brand-pages.ts's procedures — excluding createBrandPageSection, corrected to Class A, products.ts Journey/Value procedures via their required SECOND lookup, and invites.ts::getInvite), verify the ownership check correctly resolves the target brand and rejects cross-brand; AND verify a legitimate same-brand caller still succeeds on every one of the 51+ procedures (the happy-path regression Cycle 1 found untested). Journey/Value procedures specifically must be tested with the second (product) lookup actually wired in, not assumed free."
    category: happy_path
    invariant_ref: INV-006
    verification:
      type: automated
      test_ref: brands.ownership.spec.ts::resolved-class-and-same-brand-happy-path
      reason_code: null
      reason: null
    status: pending
  - id: SCN-011
    requirement_ids:
      - REQ-009
    description: "ADDED (Critic Cycle 1, non-blocking): a rejected cross-brand attempt (FORBIDDEN from the new ownership check) is logged/alerted via existing operational-alert infrastructure, so repeated post-deploy probing of the newly-closed chain is detectable during rollout"
    category: observability
    invariant_ref: null
    verification:
      type: automated
      test_ref: brands.ownership.spec.ts::cross-tenant-rejection-alerted
      reason_code: null
      reason: null
