schema_version: "1.0"
task:
    id: REN-129
    title: Reassess the 5-second delayed PostHog init
    source: linear
    branch: ayanganguly333/ren-129-reassess-the-5-second-delayed-posthog-init
    status: BLOCKED
    linear:
        priority: High
        status: Deployed to Prod
        labels: []
        assignee: Ayan Ganguly
        url: https://linear.app/renivet/issue/REN-129/reassess-the-5-second-delayed-posthog-init
        comments: []
        relations: [REN-164]
risk:
    initial_risk: L3
    path_rule_risk: L3
    semantic_risk: L3
    final_risk: L3
    reasons:
        - "Changes the external analytics SDK lifecycle and early event coverage."
        - "Immediate initialization versus delayed replay is a performance and measurement trade-off."
    escalation_history: []
investigation:
    depth: dependency_tracing
    investigated_areas:
        - src/components/providers/client.tsx
        - src/components/providers/posthog-init-policy.ts
        - src/components/globals/posthog/page-view.tsx
        - src/components/globals/posthog/identify-bridge.tsx
        - package.json and bun.lock posthog-js version
        - pinned posthog-js capture/init/session-recording source
        - Linear REN-129 and related REN-164
    excluded_areas:
        - {area: production_deployment, reason: "No production mutation during specification."}
        - {area: event_schema_redesign, reason: "Issue concerns initialization timing only."}
    dependencies: [DEP-001, DEP-002, DEP-003, DEP-004]
    integrations: [INT-001, INT-002, INT-003]
    security_boundaries: [SEC-001]
    state_transitions:
        - provider_mount -> posthog_initialized
        - posthog_initialized -> replay_enabled
        - provider_unmount -> replay_start_cancelled
    related_tests:
        - src/components/providers/client.test.ts
        - src/components/globals/posthog/identify-bridge.test.ts
    uncertainties:
        - "Deployed PageSpeed and event-coverage deltas require staging/production validation."
requirements:
    - {id: REQ-001, description: "PostHog initialization is not delayed by replay delay.", type: explicit}
    - {id: REQ-002, description: "Session recording is disabled during immediate initialization.", type: explicit}
    - {id: REQ-003, description: "Session recording starts after the configured delay when mounted.", type: explicit}
    - {id: REQ-004, description: "Early core events remain eligible for capture.", type: explicit}
    - {id: REQ-005, description: "Existing analytics and lifecycle contracts remain unchanged.", type: explicit}
    - {id: REQ-006, description: "Cleanup cancels delayed replay startup safely.", type: explicit}
    - {id: REQ-007, description: "Staging and production verify tracking and PageSpeed impact.", type: explicit}
scenarios:
    - {id: SCN-001, requirement_ids: [REQ-001, REQ-002], description: "Provider mount immediately initializes with replay disabled."}
    - {id: SCN-002, requirement_ids: [REQ-004], description: "Early pageview is not lost after provider mount."}
    - {id: SCN-003, requirement_ids: [REQ-003], description: "Replay starts after delay while mounted."}
    - {id: SCN-004, requirement_ids: [REQ-006], description: "Unmount cancels delayed replay startup."}
    - {id: SCN-005, requirement_ids: [REQ-005], description: "Existing event and identity behavior is unchanged."}
    - {id: SCN-006, requirement_ids: [REQ-007], description: "Staging verifies the performance/tracking trade-off."}
    - {id: SCN-007, requirement_ids: [REQ-007], description: "Production verifies rollout metrics."}
invariants:
    - {id: INV-001, description: "PostHog initializes once per provider mount."}
    - {id: INV-002, description: "Core capture is available before replay starts."}
    - {id: INV-003, description: "Replay is not enabled before the configured delay."}
    - {id: INV-004, description: "Cleanup prevents stale delayed callbacks."}
    - {id: INV-005, description: "The change introduces no duplicate pageview."}
    - {id: INV-006, description: "Automated tests emit no production analytics."}
flows:
    - id: FLOW-001
      description: "Mount, initialize immediately with replay disabled, and capture core events."
      state_transitions: [{from: provider_mount, to: posthog_initialized}, {from: posthog_initialized, to: core_capture_available}]
    - id: FLOW-002
      description: "After the delay, start recording only if the provider remains mounted."
      state_transitions: [{from: posthog_initialized, to: replay_enabled}]
    - id: FLOW-003
      description: "Unmount clears the delayed replay callback."
      state_transitions: [{from: provider_mount, to: replay_start_cancelled}]
    - id: FLOW-004
      description: "Validate staging, roll out, and measure production behavior."
      state_transitions: [{from: staging_verified, to: production_rollout_measured}]
dependencies:
    - {id: DEP-001, description: "Pinned posthog-js 1.215.6 init and session recording APIs.", status: resolved}
    - {id: DEP-002, description: "Renivet PostHog provider and consumer components.", status: resolved}
    - {id: DEP-003, description: "Existing 1.5-second initialization delay policy, repurposed as replay delay.", status: resolved}
    - {id: DEP-004, description: "REN-164 verification evidence confirming pre-init capture loss.", status: resolved}
integrations:
    - {id: INT-001, system: "PostHog browser SDK", purpose: "Initialize analytics and control session recording."}
    - {id: INT-002, system: "React lifecycle", purpose: "Schedule and cancel delayed replay startup."}
    - {id: INT-003, system: "Vercel and PostHog environments", purpose: "Verify deployed performance and event coverage."}
personas:
    - {id: PER-001, role: analytics_operator, applicability: "Needs complete early event coverage."}
    - {id: PER-002, role: performance_owner, applicability: "Needs PageSpeed impact measured before rollout."}
security_boundaries:
    - {id: SEC-001, description: "Automated validation must not emit analytics to production."}
business_rules:
    - {id: BR-001, description: "Core event capture takes priority over delayed replay startup."}
    - {id: BR-002, description: "Replay starts only after the configured delay."}
    - {id: BR-003, description: "Performance impact is measured, not assumed."}
decisions:
    - {id: DEC-001, question: "Immediate init with delayed replay or retain a short init delay?", class: HUMAN_CONFIRMATION, status: unresolved, recommendation: "Choose immediate init with disable_session_recording true, then startSessionRecording after 1.5 seconds.", confidence: high, consequence: high, human_confirmation_required: true}
test_expectations:
    - {id: TEXP-001, category: unit, classification: REQUIRED, reason: "Immediate init must disable session recording."}
    - {id: TEXP-002, category: unit, classification: REQUIRED, reason: "Delayed replay must start once and only after the delay."}
    - {id: TEXP-003, category: regression, classification: REQUIRED, reason: "Unmount must cancel delayed replay startup."}
    - {id: TEXP-004, category: regression, classification: REQUIRED, reason: "Existing pageview and identity behavior must remain intact."}
    - {id: TEXP-005, category: external_integration, classification: REQUIRED, reason: "Staging must verify early capture and replay timing."}
    - {id: TEXP-006, category: external_integration, classification: REQUIRED, reason: "Production must verify event coverage, replay, and PageSpeed."}
