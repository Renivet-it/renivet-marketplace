flow_design:
  present: true
  involves_external_system: true
  synchronization_failure_handling: "On a brand-call failure, the failure is caught (existing behavior, preserved) but must now additionally: (1) not clear that brand's cart items, (2) raise an operational alert via createOperationalAlert with the failed brand/items, (3) not contribute to the emitted purchase_completed event's totals. On total mutation failure (zero brands succeeded), behavior is unchanged (existing throw)."
  reconciliation_strategy: "New: a razorpayOrderId column persisted on each created consumer order row at creation time, populated from the same Razorpay order id already available in the client handler's payload — mirroring the existing corporate-order schema precedent. Webhooks query by this column instead of orders.id. A bounded-time (e.g. 30 minute) sweep or the existing order-ops dashboard's own pending-order query is extended to also flag any checkout whose alert-log shows a brand-call failure with no corresponding compensating action recorded, satisfying REQ-004/INV-004 without inventing a new infrastructure component."
