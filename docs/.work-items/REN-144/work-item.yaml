scope_contract:
  in_scope:
    - "Multi-item and multi-brand order creation during checkout, both live checkout entry points (checkout-content.tsx flow and order-payment-page.tsx flow), since both call the same server-side createOrder path"
    - "Transaction boundary around order-row creation per brand-call in src/lib/trpc/routes/general/orders.ts"
    - "Cart-clearing scope following order creation (src/lib/razorpay/payment.ts deleteItemFromCart call)"
    - "Success/partial/failure UI state distinction shown to the customer"
    - "Webhook/reconciliation ID-matching for consumer orders (both payments and refunds webhooks)"
    - "Orphaned/pending order-state detection and operator-facing alerting"
    - "Interaction with REN-131's newly-shipped purchase_completed capture (verified this pass to inherit the same partial-success overstatement risk Gate B warned about pre-implementation)"
  out_of_scope:
    - "Corporate-order payment flows (separate schema, already has razorpayOrderId columns — confirmed not affected by this defect)"
    - "General payment-method additions or checkout UI redesign beyond the success/partial/failure states"
    - "Consolidating the two duplicate checkout code paths into one implementation (tracked separately; this fix must apply to whichever implementation(s) are live at implementation time)"
    - "REN-133's client-side purchase_completed helper consolidation (separate ticket, sequenced after REN-131 per existing Gate B decision)"
  dependencies:
    - description: "Confirm whether a manual/admin-side reconciliation process for orphaned/partial orders already exists outside the codebase (support runbook, admin panel action) — materially affects how urgently the webhook/ID-matching fix must ship alongside the transaction/UI fix"
      type: DESIGN_BLOCKER
      status: resolved
      resolved_at: "2026-09-01T07:00:00Z"
    - description: "Critic Cycle 3 (2026-08-31): REQ-007's webhook fix design uses a singular lookup (orderQueries.getOrderById, backed by db.query.orders.findFirst) but a single razorpayOrderId/razorpayPaymentId is shared by MANY order rows (one per line item). A findFirst-based fix would reconcile only one sibling row per webhook event, leaving the rest unreconciled — potentially reintroducing REN-144's own core defect through the fix meant to close it. RESOLVED (controller iteration, 2026-09-01): a concrete engineering fix (switch to findMany keyed on orders.paymentId, loop reconciliation over every returned row) was designed directly into REQ-007 — this was a resolvable design question, not a business decision, so no human input was required."
      type: DESIGN_BLOCKER
      status: resolved
      resolved_at: "2026-09-01T06:20:00Z"
    - description: "Critic Cycle 3 (2026-08-31): REQ-010's atomic stock-decrement guarantee is defeated by two existing layers of silenced error handling — updateProductStock (product.ts:3541-3548) converts a failed per-item update into a swallowed {success:false} return instead of throwing, and orders.ts's call site (~1299-1313) has its corresponding TRPCError throw already commented out and never inspects the returned {updated, failed} object. Implementing the atomic WHERE quantity >= N guard exactly as specified would not actually prevent oversell unless a developer also removes/fixes both swallow points. RESOLVED (controller iteration, 2026-09-01): REQ-010 now specifies both required fixes explicitly, including a THIRD, sharper failure mode found by direct code re-verification — a zero-rows-affected UPDATE (the actual oversell-prevention mechanism) doesn't throw at all in this codebase's query pattern, so the fix must check for a falsy returned row, not just fix the try/catch. Concrete engineering fix, no human input required."
      type: DESIGN_BLOCKER
      status: resolved
      resolved_at: "2026-09-01T06:20:00Z"
    - description: "Critic Cycle 3 (2026-08-31): REQ-009's idempotency key requires NEW columns on the orders table (productId/variantId do not exist there today, only on orderItems and the transient input) — a schema change beyond the already-planned razorpayOrderId addition, not merely 'pick existing column names.' Needs explicit schema-design sign-off. RESOLVED (controller iteration, 2026-09-01): direct schema re-verification found orders.paymentId ALREADY EXISTS and is already populated with the Razorpay payment id for online orders (orders.ts:1315-1332) — no new column needed on orders. The actual gap is narrower than Cycle 3 feared: add one new nullable paymentId column to orderItems (denormalized from the same already-correct source) plus a unique constraint on orderItems(paymentId, productId, variantId). Concrete, evidence-grounded schema decision — no human/Product sign-off required, this is not a business ambiguity."
      type: DESIGN_BLOCKER
      status: resolved
      resolved_at: "2026-09-01T06:20:00Z"
    - description: "REN-131 (server-side purchase_completed capture) has already shipped (commit 8a5c8a4a, merged PR #599, 2026-08-30) and captures totalAmountPaise/totalItems from the full checkout input rather than from createdOrders — it must be re-patched to scope its emitted event to actual created orders once this issue's transaction/success-signal work lands, or it will keep overstating conversion value on every partial-failure checkout starting now, not just hypothetically"
      type: IMPLEMENTATION_PREREQUISITE
      status: unresolved
      resolved_at: null
    - description: "orderShipments.delhiveryTrackingJson-style raw-response persistence pattern already exists in the codebase and should be reused for order-creation failure logging rather than inventing a new mechanism"
      type: INFORMATIONAL_DEPENDENCY
      status: resolved
      resolved_at: "2026-08-31T18:40:00Z"
  assumptions:
    - "Razorpay payment capture itself (HMAC verification) is out of scope and correctly implemented today; only what happens after capture (order-row creation, cart-clearing, UI state, webhook matching) is in scope"
    - "The per-brand loop structure (one createOrder call per brand, itself looping per line item) remains the architecture; this SPEC does not propose collapsing multi-brand carts into a single atomic transaction across brands, since brands are independent fulfillment units — see INV-003 and the Architecture section for why atomicity is scoped per-brand, not per-checkout"
  scope_changes: []
requirements:
  - id: REQ-001
    text: "A payment that results in fewer created orders than paid-for line items must never present an unqualified 'success' state to the customer"
    source: "REN-144 acceptance criteria (Linear)"
  - id: REQ-002
    text: "Cart-clearing must remove only items whose order was successfully created; items whose order-row creation failed must remain in the cart"
    source: "REN-144 acceptance criteria (Linear)"
  - id: REQ-003
    text: "A partial or failed order-creation outcome must be discoverable by Renivet's own systems (support/ops) without relying on a customer complaint, within a defined time bound"
    source: "REN-144 acceptance criteria (Linear)"
  - id: REQ-004
    text: "No order row may exist in a permanently unreconciled pending state with no path to resolution"
    source: "REN-144 acceptance criteria (Linear)"
  - id: REQ-005
    text: "Existing full-success paths (all items succeed) must be unaffected in behavior or latency"
    source: "REN-144 acceptance criteria (Linear)"
  - id: REQ-006
    text: "Order-row creation for a single brand's line items must be atomic: either all of that brand's items get order rows, or none do — no partial/orphaned rows within a single brand-call"
    source: "Architect investigation — src/lib/trpc/routes/general/orders.ts has no db.transaction anywhere; root cause analysis in Gate B (docs/enhancement-improvements/execution-readiness/02-REN131_133_SEQUENCE.md)"
  - id: REQ-007
    text: "REVISED (Controller iteration Rev.4, 2026-09-01, resolves Critic Cycle 4's refund-logic finding): Razorpay payments webhook must resolve ALL consumer order rows sharing the payload's razorpay_payment_id — not one. Fix: replace `orderQueries.getOrderById` (`findFirst`) with `findMany` keyed on `orders.paymentId`, looping reconciliation-only logic (verify status, alert on mismatch) across every returned row. The gate keys off whether Phase 1 (order rows + stock decrement) already committed for this payment (per REQ-009's idempotency key), NOT shipment-row existence. ADDITIONAL SCOPE CLARIFICATION per Critic Cycle 4: the live handler's stock-insufficiency-triggered refund branch (`payments/route.ts` ~487-560 — computes stock availability for a single order and calls `razorpay.payments.refund()` for the FULL payment amount on failure) is ITSELF a re-fulfillment side effect that REQ-007's 'reconciliation-only' rule already covers, and must be skipped entirely for any Phase-1-committed order — NOT restructured into a pooled multi-row stock-check-and-refund mechanism. Rationale: once REQ-006/REQ-010 ship, stock is atomically confirmed sufficient BEFORE an order row is ever created, so this webhook-side stock re-check can never legitimately find insufficient stock for an order created after this fix ships — it is dead-by-design under the new architecture, not a case needing a batched refund redesign. This is the simpler, anti-overengineering-consistent resolution (reuse the existing 'skip all fulfillment side effects' gate rather than building new N-way refund-pooling logic) per this program's own stated preference for Reuse -> Simplify over new mechanism."
    source: "REN-144 in-scope list (Linear). REVISED after Critic Cycle 1 (re-fulfillment risk), Critic Cycle 2 (evidence correction + gate criterion), Critic Cycle 3 (cardinality gap — findFirst vs the many-rows-per-payment reality), and controller iteration Rev.3 (switched to findMany + loop). REVISED AGAIN in controller iteration Rev.4 after Critic Cycle 4 verified the findMany switch is mechanically sound (`existingOrder` is used as a strictly singular object throughout the handler — `payments/route.ts:479-560` — so a naive loop would need the refund/stock-check branch specifically addressed, not just the lookup) and found the live refund branch calls `razorpay.payments.refund()` for the full amount per order, which would fire N times (once per sibling row) under a naive loop. Resolved by recognizing this branch is already within REQ-007's own 'skip fulfillment side effects' scope, not a new gap needing new logic — a concrete engineering/scoping decision, not a business ambiguity."
  - id: REQ-009
    text: "REVISED (Controller iteration Rev.4, 2026-09-01, resolves Critic Cycle 4's NULL-semantics finding): order-row creation is idempotent at the actual insert granularity of the current data model — one order row per line item. `orders.paymentId` already exists and is already populated with `input.razorpayPaymentId` for online payments — no new column needed on `orders`. Add a nullable `paymentId` (text) column to `orderItems`, written directly from `input.razorpayPaymentId` at insert time (Cycle 4 confirmed this value is already known pre-insert — it does NOT need to wait on the separate post-insert `updateOrderStatus` call that sets `orders.paymentId`; the earlier framing requiring Phase 1 to enclose that later call was an overstatement, corrected here). IDEMPOTENCY CONSTRAINT, corrected per Critic Cycle 4: a single 3-column unique constraint on `(paymentId, productId, variantId)` is INSUFFICIENT — Cycle 4 confirmed `orderItems.variantId` is nullable, and Postgres unique constraints treat NULL as distinct from every other NULL, meaning two rows with identical `(paymentId, productId)` and `variantId = NULL` (i.e. any non-variant product, the common case) would NOT collide, silently defeating protection for exactly this defect's target class. Corrected design: TWO partial unique indexes — `UNIQUE (paymentId, productId, variantId) WHERE paymentId IS NOT NULL AND variantId IS NOT NULL` (variant products) and `UNIQUE (paymentId, productId) WHERE paymentId IS NOT NULL AND variantId IS NULL` (non-variant products). Both filter on `paymentId IS NOT NULL`, so COD/reward orders (`paymentId: null`) remain correctly exempt from either index."
    source: "Critic Cycle 1 finding (duplicate_operations/idempotency, blocking). REVISED after Critic Cycle 2 (granularity) and Critic Cycle 3 (schema-column gap). REVISED again in controller iteration Rev.3 (2026-09-01) after confirming `orders.paymentId` already exists and is already correctly populated. REVISED AGAIN in controller iteration Rev.4 (2026-09-01) after Critic Cycle 4 verified Rev.3's single unique constraint against the actual `orderItems` schema (`schema/order.ts:143-177`) and `orders.ts`'s stock-update call site (`item.variantId ?? undefined`) and found the NULL-vs-NULL gap for non-variant products — a concrete, code-verifiable engineering correction, not a new business ambiguity, resolved without Product/human input."
  - id: REQ-010
    text: "REVISED (Controller iteration, 2026-09-01, resolves Critic Cycle 3's error-swallowing DESIGN_BLOCKER): stock sufficiency AND the other stock-gating product-state flags (verificationStatus === approved, !isDeleted, isAvailable — currently bundled into one boolean with the quantity check) are evaluated atomically and conditionally at write time, inside the same transaction as the decrement, never from the pre-loop snapshot; two concurrent checkouts contending for the last unit of stock never both succeed. `updateProductStock`'s existing internal `db.transaction()` must be restructured to accept and join the outer per-brand-call transaction. TWO SPECIFIC CODE-LEVEL FAILURE MODES MUST BOTH BE CLOSED, not just the transaction-nesting: (1) `updateProductStock`'s per-item `try/catch` (product.ts:~3505-3548) currently converts any thrown error into a returned `{success:false, error:'Update failed (silenced)'}` object instead of propagating it — this must throw (or the caller must treat `success:false` as fatal, aborting the transaction) rather than being swallowed. (2) Separately and more critically: adding a `WHERE quantity >= N` guard to the `UPDATE` statement makes an insufficient-stock condition return ZERO ROWS, which is a normal (non-throwing) result in this codebase's Drizzle pattern (`const [result] = await tx.update(...).where(...).returning()` yields `result: undefined`, not a caught exception) — today's code would record this as `{success: true, data: undefined}`, not even reaching the swallowed-error path. The fix must explicitly check `if (!result) { /* insufficient stock */ }` and treat that as a hard failure, in addition to fixing the try/catch. The call site (orders.ts:~1299-1313) must inspect the result and rollback (throw within the transaction) rather than only logging via the currently-commented-out `TRPCError` throw."
    source: "Critic Cycle 1 finding (concurrency/race_conditions/data_integrity, blocking) — verified the stock check at orders.ts:1258-1270 reads productDetailsByIndex fetched once via Promise.all before the per-item loop begins (lines 491-511), a TOCTOU race; verified updateProductStock (product.ts:3497-3537) has no WHERE quantity >= N floor guard. EXPANDED after Critic Cycle 2: verified updateProductStock opens its own internal db.transaction() and that isStockAvailable bundles non-quantity flags into the same pre-loop-snapshot boolean. EXPANDED after Critic Cycle 3: found the try/catch swallow point plus the call site's commented-out throw. REVISED again in this controller iteration with direct re-verification of the exact code (product.ts:3497-3548, orders.ts:1255-1313): found the swallow-point fix ALONE is insufficient — a `WHERE quantity >= N`-guarded UPDATE returning zero affected rows is not an exception in this codebase's `const [result] = await tx.update(...).returning()` pattern, so the fix must explicitly check for a falsy `result`, not just wrap in try/catch. This is a concrete engineering fix, resolved without Product/human input."
  - id: REQ-011
    text: "External side effects (Delhivery shipment creation, customer/brand emails) for a brand-call's items are only attempted after that brand-call's order rows, order-item rows, and stock decrements are durably committed to the database; a failure while performing an external side effect after commit never triggers a database rollback and never re-executes the database phase. A brand-call whose Phase 1 committed but whose Phase 2 (shipment) failed/is-pending must be marked in a durable, ops-visible way (e.g. a fulfillmentStatus flag) distinct from 'never attempted' — this is the signal REQ-007's webhook gate (below) must key off, NOT shipment-row existence."
    source: "Critic Cycle 1 finding (invalid_state_transitions/rollback_recovery, blocking) — verified the current per-item loop (orders.ts lines 536-1440) creates a real Delhivery shipment/AWB (lines 1016-1039) and sends emails BEFORE validating/decrementing stock for that same item (lines 1258-1307), so a later item's failure in the same brand-call cannot un-send an earlier item's already-real shipment/email. Last clause added after Critic Cycle 2 found the original webhook-gate design (keying on shipment-row existence) would be defeated by exactly this Phase-2-pending state — see REQ-007."
  - id: REQ-012
    text: "The server-side full-cart-cache drop in the createOrder mutation (currently `userCartCache.drop(user.id)`, unconditional, fired once per createOrder/brand-call invocation) must be scoped to remove only the cart entries for the brand/items whose Phase 1 just committed in that specific invocation — never the customer's entire cart cache — since the client calls createOrder once per brand sequentially, and an unconditional full-cache drop after the first brand's call would wipe cart entries for brands whose createOrder call hasn't run yet."
    source: "Critic Cycle 2 finding (2026-08-31) — verified at orders.ts:1447-1450 (`if (!input.isSwapRewardOrder) { await userCartCache.drop(user.id); }`, positioned after the per-item loop but BEFORE the client's payment.ts loop has called createOrder for any other brand). This is a second, independent cart-clearing defect from the client-side `deleteItemFromCart` call already covered by REQ-002/Architecture item 3 — Revision 1 addressed only the client-side call and missed this server-side one entirely."
  - id: REQ-008
    text: "Any analytics event describing the outcome of a checkout (including REN-131's purchase_completed) must be scoped to the orders that actually succeeded, never to the full checkout input, once a partial-failure signal exists"
    source: "Architect investigation — verified 2026-08-31 that shipped commit 8a5c8a4a's capturePurchaseCompleted call uses input.totalAmount/input.items unconditionally whenever createdOrders.length > 0, inheriting exactly the overstatement risk Gate B (02-REN131_133_SEQUENCE.md) predicted pre-implementation"
  - id: REQ-013
    text: "ADDED (controller iteration, 2026-09-01, resolves DEC-001): when a brand-call's Phase 1 fails to commit despite payment capture (money captured, zero order rows exist for that brand/those items), a durable reconciliation record is raised via the existing `auditAndAlert` helper (`src/lib/monitoring-sla/audit.ts`) — entityType: 'payment_reconciliation', entityId: the razorpayPaymentId, type: 'order_reconciliation_required', severity: 'critical', dedupeKey: `order_reconciliation:{paymentId}:{brandId}`. This reuses the EXISTING `monitoringAlerts` table and its existing status lifecycle (open -> acknowledged -> escalated -> resolved, already implemented and already audited via `auditEntityChange`'s before/after value tracking) — zero new tables, zero new status machinery."
    source: "DEC-001 resolution (Product/Support, 2026-09-01: no existing manual process). Grounded in direct verification of src/lib/monitoring-sla/audit.ts (auditEntityChange/createOperationalAlert/auditAndAlert) and src/lib/db/queries/monitoring-sla.ts's existing alert-status-transition function (accepts 'acknowledged'|'escalated'|'resolved', writes resolvedAt, audits the before/after status change) — this lifecycle already exists in full and only needs to be reused, not built."
  - id: REQ-014
    text: "REVISED (controller iteration Rev.5, 2026-09-01, sharpened per Critic Cycle 5): the reconciliation record must be operator-visible without querying raw DB tables. Concretely: `getActiveAlerts`/`getActiveAlertsPage` (`src/lib/db/queries/monitoring-sla.ts`) currently filter only by `status != resolved` and `severity` — a `type` filter parameter must be ADDED to these query functions (a small, well-scoped change, not already present), and whatever UI consumes them extended with columns for customer, payment, missing brand/items, and alert age, filtered to `type: 'order_reconciliation_required'`. This is more specific than 'extend the existing surface' — it names the exact query-layer gap."
    source: "DEC-001 resolution — 'operator visibility' requirement. SHARPENED after Critic Cycle 5 (2026-09-01) found getActiveAlerts/getActiveAlertsPage have no type filter today — verified directly at monitoring-sla.ts:932-974 — so 'extend the existing surface' understated that a new filter parameter is genuinely needed, not just a UI-level change."
  - id: REQ-015
    text: "REVISED (controller iteration Rev.5, 2026-09-01, note added per Critic Cycle 5): provide an operator-triggered retry action that re-attempts order creation for exactly the missing brand/items, through the SAME createOrder path used at checkout time. A retry is protected by REQ-009's idempotency constraint (so it can never create a duplicate order even if triggered more than once, including by accident or concurrently) and is NEVER automatic or silent — always an explicit operator action. The outcome (success or renewed failure) is itself recorded via `auditEntityChange` and reflected in the reconciliation record's status. NOTED INTERACTION: a successful retry's `createOrder` invocation will independently emit REQ-008's `purchase_completed` analytics event for the newly-created rows — this is intentional and correct (it reflects real, newly-completed fulfillment), not a duplicate-analytics defect, but is called out explicitly so it isn't mistaken for one during implementation/testing."
    source: "DEC-001 resolution — 'retry/recovery' requirement, plus this program's explicit 'never silently repair money/order state' principle. Reuses REQ-009's idempotency guarantee rather than inventing a separate retry-safety mechanism. Analytics-interaction note added after Critic Cycle 5 (2026-09-01) flagged it as worth stating explicitly, though not blocking."
  - id: REQ-016
    text: "REVISED (controller iteration Rev.5, 2026-09-01, resolves Critic Cycle 5's finding): if retry is not possible or not desired (e.g. the item is now out of stock, or the customer no longer wants it), an operator can issue a refund for specifically the unfulfilled portion using the EXISTING finance-refund pipeline — `src/lib/finance/refunds.ts`'s `createFinanceRefundCase(input: { amountPaise, ... })` (which already accepts an arbitrary partial amount, routes through an existing approval-threshold check via `getRefundApprovalThresholdPaise`, and is executed via the existing `executeApprovedRefund`) — for the unfulfilled line item(s)' amount specifically, never the full payment amount when only some items are unfulfilled, and never automatically. This action closes the reconciliation record with resolution type 'refunded'."
    source: "DEC-001 resolution — 'refund handling' requirement. ORIGINAL CITATION WAS WRONG, corrected after Critic Cycle 5 (2026-09-01): the three originally-cited call sites (cancel-order-helper.ts:47-67, orders.ts:1797-1817, returnReplace.ts:626/719) were directly re-read and confirmed to ALL hardcode a full-order-total refund (`amount: order.totalAmount` / `existingOrder.totalAmount` / `customer.totalAmount`) — none supports a partial amount, which is REQ-016's own explicit, non-negotiable requirement. The genuinely partial-capable existing pattern is `src/lib/finance/refunds.ts`'s `createFinanceRefundCase`, which takes an arbitrary `amountPaise` — confirmed directly at finance/refunds.ts:39,240,256. This correction is a citation fix from evidence, not a new business decision or invented requirement."
  - id: REQ-017
    text: "REVISED (controller iteration Rev.5, 2026-09-01, note added per Critic Cycle 5): every reconciliation record must reach exactly one terminal resolution before being marked resolved: 'retried_and_fulfilled' (REQ-015 succeeded), 'manually_fulfilled' (operator created the order through an existing out-of-band mechanism, with a mandatory reason note), or 'refunded' (REQ-016). The full state-transition history (open -> ... -> resolved, with actor and reason at each step) must be reconstructable from the existing `auditEntityChange` audit-log table. No reconciliation record may be silently marked resolved without one of these three resolution types and an attributed actor. KNOWN LIMITATION, noted not deferred: the existing `updateAlertStatus`'s `AlertAction` type stores resolution detail in a free-text `reasonCode`/`notes` field, not a validated enum — the three resolution types are an APPLICATION-LAYER CONVENTION, not schema-enforced. This is acceptable for V1 (nothing in this codebase enforces stricter typing for alert resolution today, and adding a new enum column would be new schema beyond this fix's minimal footprint) but should be enforced by application-level validation (reject an unrecognized resolution string) at implementation time, not assumed automatically safe."
    source: "DEC-001 resolution — 'audit trail' and 'final resolution' requirements, plus the explicit 'never silently repair' principle from the controller instruction. Reuses the existing auditEntityChange table exclusively. Limitation noted after Critic Cycle 5 (2026-09-01) confirmed AlertAction has no enum/metadata field for this — a real but non-blocking gap, addressed as an implementation-time validation requirement rather than a schema change."
invariants:
  - id: INV-001
    statement: "No customer-facing 'success' (unqualified) state may be shown unless the number of created order rows equals the number of paid-for line items for that checkout"
    source_derivation: "REN-144 CJ-F004"
    validation_strategy: "Automated test: force a mid-loop brand failure in a multi-brand cart; assert the client never renders the unqualified success copy, and instead renders a partial-outcome state"
    affected_scenarios: ["SCN-001", "SCN-006", "SCN-007"]
    status: pending
  - id: INV-002
    statement: "A cart item is only removed from the cart if its corresponding order row was successfully created"
    source_derivation: "REN-144 CJ-F004"
    validation_strategy: "Automated test: force one brand's failure in a two-brand cart; assert the failed brand's cart rows remain, the succeeded brand's rows are cleared"
    affected_scenarios: ["SCN-004", "SCN-006"]
    status: pending
  - id: INV-003
    statement: "Order-row creation for a single brand-call is atomic: a failure partway through one brand's line items leaves zero rows for that brand, never a partial subset"
    source_derivation: "Gate B root-cause analysis (02-REN131_133_SEQUENCE.md); DEF-003's sibling pattern (PAT-CONTRACT-01) of a stale/mismatched call site is the same defect class — a shared function contract (order-row insertion) has an implicit atomicity contract nothing currently enforces"
    validation_strategy: "Automated test: force a failure on line item N of M within a single brand's loop; assert zero order rows exist for that brand afterward (query DB directly in the test)"
    affected_scenarios: ["SCN-003", "SCN-017"]
    status: pending
  - id: INV-004
    statement: "Every payment-capture event has a corresponding server-side record, within a bounded time window, that is either fully reconciled (order rows == paid items) or explicitly flagged pending_reconciliation and visible to ops — never silently unresolved"
    source_derivation: "REN-144 acceptance criteria; DEF-002's PAT-EXTSTATE-01 pattern (a state transition must not be inferred from absence of failure)"
    validation_strategy: "Integration/QA-runtime test: force a brand-call failure, assert an operational alert (via the existing createOperationalAlert helper, now specifically REQ-013's 'order_reconciliation_required' type) is raised and visible in the ops-facing surface within the same request cycle"
    affected_scenarios: ["SCN-004", "SCN-009", "SCN-023"]
    status: pending
  - id: INV-012
    statement: "ADDED (controller iteration, 2026-09-01): no reconciliation record ever transitions to resolved without an attributed operator action and one of exactly three recorded resolution types (retried_and_fulfilled / manually_fulfilled / refunded) — money or order state is never repaired by an automated process without a human-attributed, audited action"
    source_derivation: "Controller instruction's explicit 'never silently repair money/order state' principle, made concrete via REQ-017 and the existing auditEntityChange table"
    validation_strategy: "Automated test: attempt to mark a reconciliation record resolved without a resolution type or actor; assert rejected. Integration test: complete each of the three resolution paths (retry-success, manual-fulfillment, refund) and assert the full audit trail is reconstructable from auditEntityChange records alone."
    affected_scenarios: ["SCN-024", "SCN-025", "SCN-026"]
    status: pending
  - id: INV-005
    statement: "REVISED (controller iteration, 2026-09-01): a Razorpay payment webhook event for a consumer order resolves to ALL order rows sharing that payment (one per line item, per REQ-009), never just one — and never exits via 'Order not found' for a payment that genuinely has order rows"
    source_derivation: "REN-144 in-scope list; verified this pass at src/app/api/webhooks/razorpay/{payments,refunds}/route.ts (getOrderById(orderId) where orderId is Razorpay's own order_id) vs. orders.ts:562 (generateOrderId(brand.name)). Revised after Critic Cycle 3 found the singular-lookup cardinality gap (see REQ-007) — this invariant's original 'the correct order(s)' phrasing was too weak to catch a fix that resolves only one of several correct rows."
    validation_strategy: "Integration test: simulate a payments-webhook payload for a payment that produced 3 order rows (multi-item single-brand); assert ALL 3 rows are found and reconciled, not just one"
    affected_scenarios: ["SCN-010", "SCN-011", "SCN-018", "SCN-021"]
    status: pending
  - id: INV-007
    statement: "REVISED (Critic Cycle 2): no two order rows are ever created for the same (razorpayPaymentId, line-item-identifying key) tuple, even under a retried or concurrent duplicate request — where the key matches the actual one-row-per-line-item granularity of the current data model, not a per-brand aggregate"
    source_derivation: "Critic Cycle 1 finding (duplicate_operations/idempotency, blocking); key granularity corrected after Critic Cycle 2 found the original (razorpayPaymentId, brandId) key would reject legitimate multi-item same-brand carts on the happy path"
    validation_strategy: "Automated test: fire two concurrent (or sequential-retry) createOrder-equivalent calls carrying the same razorpayPaymentId for the same multi-item brand-call; assert exactly one order row per line item exists afterward (not zero, not two) — backed by a unique DB constraint at the verified-correct granularity, not merely an application-level check"
    affected_scenarios: ["SCN-007"]
    status: pending
  - id: INV-011
    statement: "A single createOrder/brand-call invocation's cart-clearing (both the client-side deleteItemFromCart call and the server-side userCartCache.drop call) removes only that invocation's own successfully-created items from the cart — never a different brand's items whose createOrder call hasn't run yet"
    source_derivation: "Critic Cycle 2 finding (2026-08-31) — server-side userCartCache.drop(user.id) at orders.ts:1447-1450 is unconditional and fires once per brand-call, before the client's sequential per-brand loop has necessarily called createOrder for other brands"
    validation_strategy: "Automated test: two-brand cart, mock/observe the cart cache between the first and second brand's createOrder calls; assert the second brand's cart entries are still present after the first brand's call completes, not wiped by its cache-drop"
    affected_scenarios: ["SCN-019"]
    status: pending
  - id: INV-008
    statement: "A product's stock quantity is never decremented below zero, and two concurrent checkouts contending for the last unit of stock never both succeed"
    source_derivation: "Critic Cycle 1 finding (concurrency/race_conditions/data_integrity, blocking)"
    validation_strategy: "Automated test: seed a product at quantity=1, fire two concurrent order-creation attempts for it; assert exactly one succeeds, one fails with an insufficient-stock error, and final quantity is 0, never negative"
    affected_scenarios: ["SCN-008"]
    status: pending
  - id: INV-009
    statement: "A brand-call's external side effects (Delhivery shipment creation, emails) are only ever attempted for items whose order/order-item rows and stock decrement are already durably committed; no real-world shipment or email is ever created for an item whose database phase ultimately failed or rolled back"
    source_derivation: "Critic Cycle 1 finding (invalid_state_transitions/rollback_recovery, blocking)"
    validation_strategy: "Automated test: force a stock-insufficiency failure on item 2 of a 2-item single-brand order; assert zero Delhivery shipment calls and zero emails were attempted for either item, and zero order rows exist for that brand-call (the DB phase is one atomic unit, external effects run only after, per-item, on the committed rows)"
    affected_scenarios: ["SCN-003", "SCN-017"]
    status: pending
  - id: INV-010
    statement: "REVISED (Critic Cycle 2): once REQ-007 ships, a Razorpay payments webhook event for a consumer order whose Phase 1 (order rows + stock decrement) already committed never re-decrements stock and never re-sends a fulfillment email for that order — regardless of whether Phase 2 (shipment creation) has succeeded, failed, or is still pending for that order"
    source_derivation: "Critic Cycle 1 finding (external_dependency_failures, blocking). REVISED after Critic Cycle 2: (a) corrected the evidence — the live handler's risk is stock re-decrement + re-email only, Shiprocket/AWB code in this file is dead/commented-out, not a live risk; (b) corrected the gate criterion from 'shipment row exists' to 'order row exists / Phase 1 committed', since Cycle 2 found a Phase-2-pending order (legitimately no shipment row yet) would otherwise be wrongly treated as unfulfilled and have the dangerous pipeline re-run against it"
    validation_strategy: "Integration test, three cases: (1) webhook fires for an order with Phase 1 AND Phase 2 complete — assert reconciliation-only. (2) webhook fires for an order with Phase 1 committed but Phase 2 still pending/failed (no shipment row) — assert STILL reconciliation-only. (3) webhook fires for a payment with MULTIPLE sibling order rows in mixed states (some Phase 2 complete, some pending) — assert every row is reconciled independently and correctly, none skipped. Case 2 is the gap Critic Cycle 2 found; case 3 is the gap Critic Cycle 3 found (see REQ-007)."
    affected_scenarios: ["SCN-018", "SCN-020", "SCN-021"]
    status: pending
  - id: INV-006
    statement: "An analytics purchase-completion event's reported amount/item-count must never exceed what was actually fulfilled (order rows actually created) for that checkout"
    source_derivation: "Architect investigation, 2026-08-31 — REN-131 (commit 8a5c8a4a) currently violates this by construction"
    validation_strategy: "Automated test: force a partial-brand failure; assert capturePurchaseCompleted (or its replacement call site) is invoked with amounts/items derived from createdOrders only, not input.totalAmount/input.items"
    affected_scenarios: ["SCN-012"]
    status: pending
