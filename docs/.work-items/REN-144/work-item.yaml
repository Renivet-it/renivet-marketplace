decisions:
  - id: DEC-001
    question: "Does a manual/admin-side reconciliation process for orphaned/partial orders already exist today outside the codebase (a support runbook, an admin panel action) that this SPEC's new automated reconciliation sweep would duplicate or should integrate with?"
    context: "REN-144's own Linear description lists this exact question as an explicit precondition ('Confirm with the team whether any manual/admin-side reconciliation process exists today...not visible to either audit round'). Repository investigation (BROAD depth) found no such mechanism in source, but a manual/human process would not appear in source at all — this cannot be resolved by code investigation alone."
    affected_scenarios: ["SCN-005", "SCN-013"]
    options:
      - "No such process exists — build the reconciliation sweep and ops-facing surface as net-new (this SPEC's current assumption)"
      - "A manual process exists (e.g. support already manually reviews stuck orders) — the new sweep should feed into that existing workflow rather than creating a parallel one"
    recommended: "Proceed on the assumption that no such process exists (consistent with this and the prior reconciliation pass's findings), but do not mark this work item APPROVED until Product/Support confirms this explicitly — a wrong assumption here risks building a duplicate, unused tool rather than integrating with a live one"
    consequences: "If a manual process already exists and this is not confirmed before implementation, the new automated surface could go unused (duplicate tooling) or worse, create two sources of truth for the same reconciliation task"
    status: resolved
    resolution: "RESOLVED (2026-09-01) by Product/Support, authoritative: 'NO existing manual/admin reconciliation process exists for orphaned/partial orders outside the codebase.' Option 1 (build the new automated reconciliation sweep + ops-facing surface as net-new) is confirmed correct. REQ-013 through REQ-017 (added this iteration) specify the minimal, 100%-existing-infrastructure reconciliation design this decision authorizes: reuse the existing monitoringAlerts status lifecycle (open/acknowledged/escalated/resolved, already audited via auditEntityChange) for the reconciliation record, and the existing refunds table + razorpay.payments.refund pattern (already used by cancel-order-helper.ts/orders.ts/returnReplace.ts) for refund handling. Zero new tables beyond the already-planned orderItems.paymentId column; zero new services; no distributed saga, new OMS, or reconciliation platform — per this program's explicit smallest-safe-design instruction."
    resolved_by: "Product/Support, relayed via controller iteration 2026-09-01"
    resolved_at: "2026-09-01T07:00:00Z"
    linear_comment_url: null
