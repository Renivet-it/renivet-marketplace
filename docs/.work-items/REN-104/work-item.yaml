schema_version: "1.0"
task:
    id: REN-104
    title: No App Router error/loading boundaries anywhere
    source: linear
    branch: ayanganguly333/ren-131-132-purchase-cart-analytics
    status: READY_FOR_DEV
    linear:
        url: https://linear.app/renivet/issue/REN-104/no-app-router-errorloading-boundaries-anywhere
        priority: Medium
        labels: [security]
        status: Backlog
        assignee: Ayan Ganguly
        project: Security & Compliance Audit
        milestone: null
risk:
    initial_risk: L3
    path_rule_risk: L3
    semantic_risk: L3
    final_risk: L3
    reasons:
        - Boundaries affect critical checkout, payment, order, and global failure paths.
        - Incorrect recovery can hide payment/order state or imply a successful purchase after a failure.
        - Error UIs cross server exception, telemetry, and customer-facing privacy boundaries.
investigation:
    depth: dependency_tracing
    investigated_areas:
        - Linear issue, security label, and requested starting scope
        - Existing app layouts and absence of error/loading/global-error boundaries
        - Checkout server/client composition and payment flow
        - Mycart payment components and protected orders segment
        - Existing not-found and error/logging conventions
        - Root layout startup effects and guest cart/wishlist merge idempotency
        - Global fallback dependency graph and localized recovery actions
    excluded_areas:
        - API/webhook try/catch redesign and provider retry contracts
        - Payment/order transaction semantics or database changes
        - Application source and tests during specification phase
    dependencies: [DEP-104-001, DEP-104-002, DEP-104-003]
    integrations: [INT-104-001]
    security_boundaries: [SEC-104-001, SEC-104-002]
    state_transitions:
        [
            route_request -> loading_boundary -> content_rendered -> render_failure -> explicit_global_reload_or_local_reset -> recovery_or_navigation,
        ]
    related_tests:
        [TEXP-104-001, TEXP-104-002, TEXP-104-003, TEXP-104-004, TEXP-104-005]
    uncertainties:
        - API/webhook route failures remain outside this first UI-boundary slice and require a separate handler-level design.
        - Segment layout failures are not caught by that segment's error.tsx and remain covered only by a parent/root boundary.
        - Browser failure-injection coverage remains required to prove framework recovery behavior end to end.
requirements:
    - id: REQ-104-001
      description: Add a minimal dependency-light global fallback with safe copy and a customer-initiated full-page reload action; it must not reset or reload automatically.
      type: explicit
    - id: REQ-104-002
      description: Add loading and error boundaries to checkout, mycart/payment, and orders route segments.
      type: explicit
    - id: REQ-104-003
      description: Preserve storefront shell, payment/order state semantics, and navigation while boundaries are active.
      type: inferred
    - id: REQ-104-004
      description: Prevent sensitive exception details from reaching customer output; best-effort logging emits only a stable marker, route segment, and Next error digest, and a throwing logging sink cannot break fallback rendering.
      type: inferred
    - id: REQ-104-005
      description: Keep API and webhook error handling out of this UI-boundary change unless separately approved.
      type: inferred
    - id: REQ-104-006
      description: Every recovery action is customer-initiated; global recovery uses full-page reload, localized purchase boundaries use App Router reset, and no recovery path automatically retries or duplicates startup, cart, wishlist, payment, order, or inventory mutations.
      type: inferred
scenarios:
    - id: SCN-104-001
      requirement_ids: [REQ-104-001, REQ-104-004]
      description: A root render failure shows a minimal safe fallback with no automatic timer; customer-initiated Try again performs one full-page reload without displaying exception details.
    - id: SCN-104-002
      requirement_ids: [REQ-104-002, REQ-104-003]
      description: Checkout, cart/payment, and orders initial loads show appropriate loading UI without false success state.
    - id: SCN-104-003
      requirement_ids: [REQ-104-002, REQ-104-003]
      description: A localized checkout, cart/payment, or orders render failure shows recoverable error UI, never retries automatically, and manual reset invokes the App Router reset path.
    - id: SCN-104-004
      requirement_ids: [REQ-104-004, REQ-104-005, REQ-104-006]
      description: Root and localized boundaries never retry automatically, a throwing logging sink remains non-fatal, recovery does not directly invoke mutations, and API/webhook behavior is unchanged.
    - id: SCN-104-005
      requirement_ids: [REQ-104-002, REQ-104-004]
      description: Failures in the root layout and named segment layouts follow the documented parent/root coverage matrix and render safe fallback output.
invariants:
    - id: INV-104-001
      description: Boundary fallback UI never claims an order or payment succeeded without authoritative success state.
    - id: INV-104-002
      description: Customer-visible errors contain no stack traces, payment credentials, addresses, tokens, or raw provider payloads.
    - id: INV-104-003
      description: Reset and navigation actions do not mutate payment, cart, order, or inventory state.
    - id: INV-104-004
      description: API and webhook handlers remain outside the UI-boundary diff.
    - id: INV-104-005
      description: Boundary logging contains only the marker, route segment, and error digest; raw exceptions and sensitive request data are excluded.
flows:
    - id: FLOW-104-001
      description: Route request enters loading boundary and renders content; a root failure enters a minimal fallback awaiting customer reload, while localized purchase failures await customer App Router reset.
      state_transitions:
          [
              route_request,
              loading_boundary,
              content_rendered,
              render_failure,
              explicit_recovery_action,
              recovery_or_navigation,
          ]
    - id: FLOW-104-002
      description: Root-level failure uses standalone global recovery while page/content failures remain localized in checkout, cart/payment, or orders; segment-layout failures use the nearest parent/root boundary.
      state_transitions: [content_rendered, segment_failure, localized_recovery]
dependencies:
    - id: DEP-104-001
      name: Next App Router boundary contract
      purpose: Defines error.tsx, loading.tsx, and global-error.tsx behavior.
      owner: Storefront maintainers
      required_state: Global recovery is standalone and customer-reloads the document; localized purchase boundaries use explicit framework reset; neither mode auto-retries.
      description: No current route boundaries exist beyond not-found.tsx.
      status: resolved
    - id: DEP-104-002
      name: checkout and payment routes
      purpose: Critical customer purchase flow requiring localized recovery.
      owner: Checkout maintainers
      required_state: Existing payment/order state remains authoritative.
      description: Checkout content is client interactive and payment operations have side effects.
      status: resolved
    - id: DEP-104-003
      name: protected orders and cart layouts
      purpose: Route-segment placement for loading/error boundaries.
      owner: Storefront maintainers
      required_state: Existing layouts and navigation remain compatible.
      description: Orders has a layout; mycart contains payment steps and its own shell.
      status: resolved
integrations:
    - id: INT-104-001
      system: existing application observability
      purpose: Uses the existing console.error convention with a stable marker, route segment, and Next error digest; no raw exception payload.
      failure_mode: Logging is guarded and a throwing sink must not prevent safe fallback rendering.
      retry_idempotency: Recovery is customer-initiated only; no timer retries rendering or replays startup/payment/order mutations.
personas:
    - id: PER-104-001
      role: shopper
      applicability: Customers loading or recovering from checkout, payment, cart, or order failures.
    - id: PER-104-002
      role: support_operator
      applicability: Operators diagnosing boundary failures through existing observability.
security_boundaries:
    - id: SEC-104-001
      description: Raw exceptions and provider payloads stay in server-side observability; customer UI receives safe generic copy.
    - id: SEC-104-002
      description: Recovery actions cannot bypass authentication, payment authorization, order persistence, or authorization checks.
business_rules:
    - id: BR-104-001
      description: A recoverable UI error must never be presented as a successful purchase or order completion.
decisions:
    - id: DEC-104-001
      question: Which boundary scope should be implemented first?
      class: HUMAN_CONFIRMATION
      status: resolved
      recommendation: Implement root global recovery plus checkout, mycart/payment, and orders segment boundaries; handle API/webhook errors in a separate task.
      basis: Owner confirmed the scoped customer-facing boundary slice and accepted keeping API/webhook handling separate.
      confidence: high
      consequence: high
      human_confirmation_required: true
    - id: DEC-104-002
      question: Should global recovery automatically reload/reset or require a customer action?
      class: HUMAN_CONFIRMATION
      status: resolved
      recommendation: Require customer action; use full-page reload globally and App Router reset locally, with no automatic timer.
      basis: The owner accepted the production-safe recommendation after investigation showed root remount can replay the non-idempotent guest-cart merge and duplicate quantity.
      confidence: high
      consequence: high
      human_confirmation_required: true
test_expectations:
    - id: TEXP-104-001
      category: component
      classification: REQUIRED
      reason: tests/ren-104-boundaries.test.ts verifies safe copy, distinct global-reload/localized-reset modes, absence of automatic timers, and global-error html/body requirements.
      scenarios: [SCN-104-001, SCN-104-002, SCN-104-003, SCN-104-005]
    - id: TEXP-104-002
      category: e2e
      classification: REQUIRED
      reason: Browser journey coverage exercises checkout, cart/payment, and orders loading/error recovery without false success state or automatic mutation retry.
      scenarios: [SCN-104-002, SCN-104-003, SCN-104-004]
    - id: TEXP-104-003
      category: security
      classification: REQUIRED
      reason: Captures a logging sink and asserts only marker/segment/digest are emitted, sensitive values are excluded, and a throwing sink cannot break fallback rendering.
      scenarios: [SCN-104-001, SCN-104-004, SCN-104-005]
    - id: TEXP-104-004
      category: regression
      classification: REQUIRED
      reason: Confirms API/webhook handlers, startup/payment state, authentication, and navigation behavior are unchanged; no recovery timer exists and recovery actions do not directly invoke mutations.
      scenarios: [SCN-104-003, SCN-104-004]
    - id: TEXP-104-005
      category: e2e
      classification: REQUIRED
      reason: Injects root and localized render failures and verifies manual global reload, explicit localized reset, dependency-light root fallback, and no automatic retry of startup or purchase actions.
      scenarios: [SCN-104-003, SCN-104-004, SCN-104-005]
traceability:
    requirement_to_scenarios:
        - requirement_id: REQ-104-001
          scenario_ids: [SCN-104-001]
        - requirement_id: REQ-104-002
          scenario_ids: [SCN-104-002, SCN-104-003]
        - requirement_id: REQ-104-003
          scenario_ids: [SCN-104-002, SCN-104-003]
        - requirement_id: REQ-104-004
          scenario_ids: [SCN-104-001, SCN-104-004]
        - requirement_id: REQ-104-005
          scenario_ids: [SCN-104-004]
        - requirement_id: REQ-104-006
          scenario_ids: [SCN-104-004]
    scenario_to_invariants:
        - scenario_id: SCN-104-001
          invariant_ids: [INV-104-001, INV-104-002]
        - scenario_id: SCN-104-002
          invariant_ids: [INV-104-001, INV-104-003]
        - scenario_id: SCN-104-003
          invariant_ids: [INV-104-001, INV-104-003]
        - scenario_id: SCN-104-004
          invariant_ids: [INV-104-002, INV-104-004]
        - scenario_id: SCN-104-005
          invariant_ids: [INV-104-001, INV-104-002, INV-104-005]
    scenario_to_test_expectations:
        - scenario_id: SCN-104-001
          test_expectation_ids: [TEXP-104-001, TEXP-104-003]
        - scenario_id: SCN-104-002
          test_expectation_ids: [TEXP-104-001, TEXP-104-002]
        - scenario_id: SCN-104-003
          test_expectation_ids: [TEXP-104-001, TEXP-104-002, TEXP-104-004]
        - scenario_id: SCN-104-004
          test_expectation_ids: [TEXP-104-003, TEXP-104-004]
        - scenario_id: SCN-104-005
          test_expectation_ids: [TEXP-104-001, TEXP-104-003, TEXP-104-005]
critic:
    required: true
    completed: true
    artifact: CRITIQUE.md
    reviewer: Carson (fresh-context independent critic)
    fresh_context: true
    read_only: true
    categories_reviewed:
        [
            requirements_scenarios,
            failure_recovery,
            security_privacy,
            state_data_consistency,
            integrations_idempotency,
            compatibility_migration,
            observability_testability,
            assumptions_dependencies,
        ]
    findings:
        - id: CRIT-104-R01
          severity: DESIGN_BLOCKER
          references: [REQ-104-001, REQ-104-004, REQ-104-006]
          description: "Resolved: allowed scope now explicitly includes the dedicated global fallback, localized boundary, loading shell, logging helper, and tests."
        - id: CRIT-104-R02
          severity: DESIGN_BLOCKER
          references: [INV-104-003, SCN-104-004, INT-104-001]
          description: "Resolved: all automatic reset/reload behavior is prohibited because root remount can replay the non-idempotent guest-cart merge."
        - id: CRIT-104-R03
          severity: DESIGN_BLOCKER
          references: [DEC-104-002]
          description: "Resolved: fresh critique, revised contract, and approval gate replace the stale failed-review governance state."
        - id: CRIT-104-R04
          severity: MAJOR
          references: [REQ-104-001, SCN-104-003, FLOW-104-001]
          description: "Resolved: global-reload and localized-reset are explicit separate recovery modes."
        - id: CRIT-104-R05
          severity: MAJOR
          references: [REQ-104-004, INT-104-001, TEXP-104-003]
          description: "Resolved: logging is guarded best-effort and a throwing-sink test is required."
        - id: CRIT-104-R06
          severity: MAJOR
          references: [REQ-104-001, FLOW-104-002]
          description: "Resolved: root fallback must be a standalone minimal module without storefront/auth/payment/provider imports."
        - id: CRIT-104-R07
          severity: MAJOR
          references:
              [
                  TEXP-104-001,
                  TEXP-104-002,
                  TEXP-104-003,
                  TEXP-104-004,
                  TEXP-104-005,
              ]
          description: "Resolved in design: tests must prove mode-specific actions, no timers, root markup, logging isolation, and browser failure injection."
        - id: CRIT-104-R08
          severity: MINOR
          references: [DEC-104-002]
          description: "Superseded: removing automatic retry also removes suppression-window edge cases."
approval:
    state: APPROVED
    design_blockers: []
    approved_by: Ayan Ganguly (owner accepted the production-safe manual recovery recommendation after cart replay risk was identified)

