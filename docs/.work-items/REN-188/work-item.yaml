          invariant_ids: [INV-188-002, INV-188-003]
        - scenario_id: SCN-188-007
          invariant_ids: [INV-188-004]
    scenario_to_test_expectations:
        - scenario_id: SCN-188-001
          test_expectation_ids: [TEXP-188-001, TEXP-188-003, TEXP-188-004]
        - scenario_id: SCN-188-002
          test_expectation_ids: [TEXP-188-001, TEXP-188-003, TEXP-188-004]
        - scenario_id: SCN-188-003
          test_expectation_ids: [TEXP-188-001, TEXP-188-003]
        - scenario_id: SCN-188-004
          test_expectation_ids: [TEXP-188-001, TEXP-188-003, TEXP-188-004]
        - scenario_id: SCN-188-005
          test_expectation_ids: [TEXP-188-001, TEXP-188-004]
        - scenario_id: SCN-188-006
          test_expectation_ids: [TEXP-188-002, TEXP-188-004]
