    categories_reviewed: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
    findings:
        - { id: CRIT-226-001, severity: MAJOR, status: open, summary: "Natural-key coverage must support split-payment refund events and cannot deduplicate only by order." }
        - { id: CRIT-226-002, severity: MAJOR, status: open, summary: "Refund persistence, derived status, and side-effect ordering need an explicit transaction/idempotency boundary." }
        - { id: CRIT-226-003, severity: MINOR, status: open, summary: "Historical mismatch handling must remain report-only until separately approved." }
        - { id: CRIT-226-004, severity: MINOR, status: open, summary: "Ongoing reconciliation requires stable alert deduplication and resolution evidence." }
