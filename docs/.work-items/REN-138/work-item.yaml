schema_version: "1.0"
task:
    id: REN-138
    title: CAPI Execution Path Optimization
    source: linear
    branch: ayanganguly333/ren-138-capi-execution-path-optimization
    status: READY_FOR_DEV
risk:
    initial_risk: L1
    path_rule_risk: L2
    semantic_risk: L2
    final_risk: L2
    reasons:
        - Telemetry is non-critical and explicitly fire-and-forget, limiting customer impact.
        - The shared server utility spans Meta external I/O, Postgres persistence, six callers, and Next request lifecycle.
        - External integration and persistence timeouts can affect delivery observability and must be designed fail-safe.
    escalation_history:
        - from: L1
          to: L2
          reason: Shared provider/database path and Next after() lifecycle require structured design and independent review.
investigation:
    depth: dependency_tracing
    investigated_areas:
        - Linear REN-138 metadata, relations, comments, and related REN-92, REN-114, REN-116, REN-139, and REN-143 context
        - src/lib/fb-capi.ts
        - src/actions/analytics.ts
        - src/app/(marketing)/products/[slug]/page.tsx
        - src/lib/hooks/useAddToCartTracking.ts
        - src/app/(protected)/checkout/checkout-content.tsx
        - src/app/(protected)/mycart/Component/payment-stepper/order-payment-page.tsx
        - src/lib/db/schema/capi-logs.ts and CAPI router/dashboard
        - env.ts and src/lib/external-side-effects.ts
        - Next 15.5.16 after() runtime sources and facebook-nodejs-business-sdk 24.0.1 request sources
        - Existing Bun tests and governance validator behavior
    excluded_areas:
        - area: Token rotation/revocation and environment schema
          reason: Owned by REN-92/REN-116; current task consumes the existing typed token and gate.
        - area: Staging authorization/kill-switch redesign
          reason: Owned by REN-143/REN-114 and is a coordination boundary, not duration optimization.
        - area: Database pool sizing or driver migration
          reason: Owned by REN-139; no need to change connection configuration for bounded CAPI work.
        - area: Queue/worker architecture and schema migration
          reason: Linear explicitly rejects it as disproportionate for non-critical telemetry; no evidence requires it.
        - area: Order/payment/shipping business flows
          reason: All observed callers already fire-and-forget and no business state is coupled to CAPI completion.
        - area: docs/infrastructure-audits/2026-08-25/*
          reason: Referenced files are absent from the inspected Git baseline; claims are retained only as Linear context.
    dependencies:
        - DEP-001
        - DEP-002
        - DEP-003
        - DEP-004
        - DEP-005
    integrations:
        - INT-001
        - INT-002
        - INT-003
        - INT-004
    security_boundaries:
        - SEC-001
        - SEC-002
        - SEC-003
        - SEC-004
    state_transitions:
        - not_started -> authorized -> attempts_started -> meta_settled_and_log_insert_settled -> terminal_logged
        - meta_settled_and_log_insert_settled -> pending_log_or_log_failure
        - request_rendering -> telemetry_registered -> response_finished -> telemetry_settled_or_contained_failure
    related_tests:
        - src/lib/fb-capi.test.ts
        - src/lib/env-context.test.ts
        - src/lib/external-side-effects.test.ts
        - src/app/(protected)/dashboard/capi-logs/page.tsx
    uncertainties:
        - Local Next after() support does not alone prove Vercel deployment waitUntil support; synchronous registration failure must remain safely contained.
        - Operations may later request a separate dashboard filter for response.outcome; labels and CSV values are specified without requiring a filter.
requirements:
    - id: REQ-001
      description: sendCapiEvent enforces a finite timeout and cancellation for the authorized Meta Graph API attempt.
      type: explicit
    - id: REQ-002
      description: Every CAPI-log database operation has its own finite deadline and supported Postgres.js cancellation attempt; it cannot extend the Meta attempt, and cancellation is not reported as confirmed through an unavailable promise.
      type: explicit
    - id: REQ-003
      description: Meta submission and initial log persistence start independently and are collected with Promise.allSettled.
      type: explicit
    - id: REQ-004
      description: CAPI log status and typed response outcome remain truthful across accepted, provider rejection, timeout, transport error, invalid response, and incomplete two-phase persistence.
      type: inferred
    - id: REQ-005
      description: Existing side-effect gating and missing-token behavior precede Meta I/O and CAPI-log writes.
      type: explicit
    - id: REQ-006
      description: Product-page ViewContent captures request data before registering a request-API-free callback with Next.js after() without making rendering await telemetry.
      type: explicit
    - id: REQ-007
      description: Existing payloads, event IDs, wrappers, and customer-visible fire-and-forget behavior remain compatible.
      type: explicit
    - id: REQ-008
      description: Timeout, cancellation, partial-completion, and provider/database failures are observable, redacted, and rejection-safe.
      type: inferred
    - id: REQ-009
      description: All six current invocation expressions across AddToCart, InitiateCheckout, Purchase, and ViewContent are covered.
      type: inferred
scenarios:
    - id: SCN-001
      requirement_ids: [REQ-001, REQ-002, REQ-003, REQ-004, REQ-007]
      description: Authorized Meta and log operations finish within budget and the log becomes success.
    - id: SCN-002
      requirement_ids: [REQ-001, REQ-002, REQ-004, REQ-008]
      description: Meta is accepted, rejected, timed out, interrupted by transport failure, or returns an invalid response while persistence remains available; the log becomes the matching truthful terminal state without unbounded waiting.
    - id: SCN-003
      requirement_ids: [REQ-001, REQ-002, REQ-003, REQ-004, REQ-008]
      description: Initial log persistence fails or times out while Meta succeeds and the Meta outcome remains independent and observable.
    - id: SCN-004
      requirement_ids: [REQ-002, REQ-004, REQ-008]
      description: Initial log insert succeeds but terminal update times out, cannot confirm cancellation, or fails, leaving an explicit pending/unknown row while a late settlement remains possible.
    - id: SCN-005
      requirement_ids: [REQ-001, REQ-002, REQ-003, REQ-008]
      description: Meta is slow while the initial DB insert is fast; both promises start independently.
    - id: SCN-006
      requirement_ids: [REQ-005, REQ-008]
      description: Side effects are disabled or the token is absent, so neither Meta nor log persistence runs.
    - id: SCN-007
      requirement_ids: [REQ-006, REQ-007, REQ-008]
      description: Product ViewContent captures request data before after(), runs a request-API-free callback after response completion, and contains callback or synchronous registration failures.
    - id: SCN-008
      requirement_ids: [REQ-007, REQ-009]
      description: AddToCart and both checkout implementations remain customer-non-blocking when telemetry is slow or unavailable.
    - id: SCN-009
      requirement_ids: [REQ-002, REQ-004, REQ-008]
      description: Transport, malformed-provider, malformed-database, synchronous adapter, and timeout errors are safely classified or serialized without secret leakage or unhandled rejection.
    - id: SCN-010
      requirement_ids: [REQ-004, REQ-007]
      description: Repeated event IDs use existing best-effort delivery semantics without automatic retry or duplication changes.
invariants:
    - id: INV-001
      description: No authorized CAPI operation awaits an unbounded Meta request or database promise; each has a deadline and supported cancellation attempt, and late database settlement is explicitly unknown.
    - id: INV-002
      description: Meta submission and initial log persistence are independent promises and one cannot short-circuit the other.
    - id: INV-003
      description: Terminal success is written only for Meta acceptance, terminal failure only for provider rejection/timeout/transport error/invalid response, and incomplete persistence remains pending/unknown at cutoff.
    - id: INV-004
      description: The side-effect gate precedes provider I/O and CAPI-log writes.
    - id: INV-005
      description: Telemetry failure cannot change order, payment, checkout, product-render, or other business state.
    - id: INV-006
      description: Event IDs and Meta payload shapes remain unchanged across all four event types.
    - id: INV-007
      description: Every started promise has an observed settlement or rejection handler.
    - id: INV-008
      description: Timeout timers are cleaned up after settlement.
    - id: INV-009
      description: Diagnostics and response data do not expose the access token or newly introduced raw secrets.
    - id: INV-010
      description: ViewContent receives pre-captured request data in an after() callback, calls no request API, and is not synchronously awaited by rendering.
flows:
    - id: FLOW-001
      description: Authorize, start abortable Meta and cancelable pending-log attempts, settle independently, then finalize the log when possible.
      state_transitions:
          - from: not_started
            to: authorized
          - from: authorized
            to: attempts_started
          - from: attempts_started
            to: meta_settled_and_log_insert_settled
          - from: meta_settled_and_log_insert_settled
            to: terminal_logged
          - from: meta_settled_and_log_insert_settled
            to: pending_log_or_log_failure
    - id: FLOW-002
      description: Capture product request data, register a request-API-free ViewContent callback after the response lifecycle, and contain registration/callback failures.
      state_transitions:
          - from: request_rendering
            to: request_data_captured
          - from: request_data_captured
            to: telemetry_registered
          - from: telemetry_registered
            to: response_finished
          - from: response_finished
            to: telemetry_settled_or_contained_failure
dependencies:
    - id: DEP-001
      description: Existing CAPI utility, typed token, sanitizer, side-effect gate, and capi_logs schema.
      status: resolved
    - id: DEP-002
      description: Analytics server actions and six current invocation expressions.
      status: resolved
    - id: DEP-003
      description: Next.js 15.5.16 next/server after() request lifecycle support.
      status: resolved
    - id: DEP-004
      description: postgres 3.4.5 and Drizzle database client.
      status: resolved
    - id: DEP-005
      description: REN-143 gate and REN-116/REN-92 token remediation as coordination constraints.
      status: resolved
integrations:
    - id: INT-001
      system: Meta Graph API / facebook-nodejs-business-sdk
      purpose: Submit server-side conversion events under a finite execution budget.
    - id: INT-002
      system: Postgres / Drizzle capi_logs
      purpose: Persist pending and terminal telemetry outcomes without coupling them to provider latency.
    - id: INT-003
      system: Vercel Node function lifecycle
      purpose: Run product ViewContent after response and measure duration/error outcomes.
    - id: INT-004
      system: CAPI log dashboard and CSV export
      purpose: Present success, failure, and pending/unknown states accurately.
personas:
    - id: PER-001
      role: customer_or_shopper
      applicability: Customer-visible page, checkout, and order behavior must not wait on telemetry.
    - id: PER-002
      role: operations_or_analytics_user
      applicability: Needs accurate CAPI status and diagnostics in the existing dashboard.
    - id: PER-003
      role: application_operator
      applicability: Needs bounded redacted timeout and persistence diagnostics.
security_boundaries:
    - id: SEC-001
      description: Provider token and database access remain server-only.
    - id: SEC-002
      description: Existing shouldRunExternalSideEffects gate remains before Meta or log side effects.
    - id: SEC-003
      description: Error diagnostics and persisted response data exclude access tokens and newly expanded raw PII.
    - id: SEC-004
      description: Existing CAPI dashboard authorization remains unchanged.
business_rules:
    - id: BR-001
      description: CAPI is non-critical telemetry and cannot fail a customer business operation.
    - id: BR-002
      description: No automatic retry or queue/worker architecture is added.
    - id: BR-003
      description: Success means Meta accepted the request; timeout is not proof of non-delivery.
decisions:
    - id: DEC-001
      question: What initial timeout budgets should be used?
      class: RECOMMEND_CONTINUE
      status: resolved
      recommendation: Use 3000 ms for Meta and 1000 ms per database operation as named constants, then tune only from deployment evidence.
      confidence: medium
      consequence: low
      human_confirmation_required: false
    - id: DEC-002
      question: How can initial logging be concurrent while retaining truthful outcome status?
      class: AUTO_DECIDE
      status: resolved
      recommendation: Use a pending insert, Promise.allSettled, and a bounded terminal update without a schema migration.
      confidence: high
      consequence: medium
      human_confirmation_required: false
    - id: DEC-003
      question: How should the Meta timeout cancel the SDK request?
      class: AUTO_DECIDE
      status: resolved
      recommendation: Inject a local HttpServiceInterface through EventRequest.setHttpService and use fetch plus AbortController while preserving SDK URL, params, headers, and response semantics.
      confidence: high
      consequence: medium
      human_confirmation_required: false
test_expectations:
    - id: TEXP-001
      category: unit
      classification: REQUIRED
      reason: AbortController cancellation, synchronous Postgres.js query cancel invocation, original-query settlement observation, timeout helper behavior, timer cleanup, and typed timeout outcomes need deterministic coverage.
    - id: TEXP-002
      category: unit
      classification: REQUIRED
      reason: Meta acceptance, provider rejection, timeout, transport error, and invalid response must map to truthful terminal log status and typed outcome.
    - id: TEXP-003
      category: unit
      classification: REQUIRED
      reason: Initial insert and Meta attempt must be proven to start independently and be collected with allSettled.
    - id: TEXP-004
      category: unit
      classification: REQUIRED
      reason: Insert failure and terminal update failure must preserve Meta outcome, pending/unknown semantics, and possible late database settlement while exercising the driver's synchronous cancel() path.
    - id: TEXP-005
      category: unit
      classification: REQUIRED
      reason: Gate-disabled and missing-token paths must perform no provider or log side effect.
    - id: TEXP-006
      category: unit
      classification: REQUIRED
      reason: Error/timeout serialization and legacy response fallback must be JSON-safe, redacted, and rejection-safe.
    - id: TEXP-007
      category: component
      classification: REQUIRED
      reason: CAPI dashboard and export must present pending/unknown, legacy, and typed timeout/provider/transport/invalid-response outcomes distinctly from confirmed success.
    - id: TEXP-008
      category: component
      classification: REQUIRED
      reason: Product page must capture request data before after(), run a request-API-free callback, and avoid making rendering await telemetry.
    - id: TEXP-009
      category: integration
      classification: REQUIRED
      reason: Next request lifecycle, request-data capture, callback completion, and synchronous registration failure need runtime-level verification.
    - id: TEXP-010
      category: integration
      classification: REQUIRED
      reason: Meta/DB latency and failure combinations must prove bounded total behavior and no business-state coupling.
    - id: TEXP-011
      category: regression
      classification: REQUIRED
      reason: All six invocation expressions and four event payload shapes must remain covered.
    - id: TEXP-012
      category: performance
      classification: REQUIRED
      reason: Vercel duration and cited CAPI/DB timeout signatures must be compared post-deployment.
    - id: TEXP-013
      category: exploratory
      classification: REQUIRED
      reason: Vercel runtime liveness and actual aborted-request behavior must be checked for the custom SDK HTTP adapter.
    - id: TEXP-014
      category: security
      classification: REQUIRED
      reason: Timeout/provider diagnostics and persisted response data must not expose tokens or newly introduced secrets.
