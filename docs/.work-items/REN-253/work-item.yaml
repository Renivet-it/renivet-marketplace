    initial_risk: L3
    path_rule_risk: L3
    semantic_risk: L3
    final_risk: L3
    reasons:
        - "Payout calculations and execution affect company money."
        - "The task crosses authorization, audit, provider replay, and RTO financial attribution boundaries."
        - "Production deployment and migration evidence are access-dependent and must remain read-only."
    escalation_history: []
investigation:
    depth: dependency_tracing
    investigated_areas: [Linear issue and relations, commission fallback, payout cycle state transitions, finance module access, statement route, payout execution gate, RTO attribution paths, existing finance tests]
    excluded_areas: [payout execution, production data mutation, new commission policy, C1 payee identity controls, RTO fee policy, tax policy]
    dependencies: [DEP-253-001, DEP-253-002, DEP-253-003]
    integrations: [INT-253-001, INT-253-002]
    security_boundaries: [SEC-253-001, SEC-253-002, SEC-253-003]
    state_transitions: [draft, calculated, approved, processing, completed, failed, locked_rto, unlocked_rto]
    related_tests: [TEXP-253-001, TEXP-253-002, TEXP-253-003, TEXP-253-004, TEXP-253-005, TEXP-253-006]
    uncertainties: ["Provider-specific idempotency field and local persistence boundary must be confirmed during implementation planning without changing the approved cycle-and-brand identity.", "Statement route response behavior must preserve existing PDF output while adding authorization."]
requirements:
    - { id: REQ-253-001, description: "Fail closed when no approved commission rule exists.", type: safety }
    - { id: REQ-253-002, description: "Allow recalculation only for draft and calculated cycles.", type: state_transition }
    - { id: REQ-253-003, description: "Protect payout statement reads with existing finance access.", type: security }
    - { id: REQ-253-004, description: "Prevent same-actor execution and duplicate cycle-and-brand payout submission.", type: safety }
    - { id: REQ-253-005, description: "Use one lock-aware audited RTO fault-owner authority.", type: security }
    - { id: REQ-253-006, description: "Do not clear or execute payouts.", type: boundary }
scenarios:
    - { id: SCN-253-001, description: "Missing commission rule fails closed.", requirement_ids: [REQ-253-001] }
    - { id: SCN-253-002, description: "Allowed and rejected recalculation states behave explicitly.", requirement_ids: [REQ-253-002] }
    - { id: SCN-253-003, description: "Only authorized payout viewers can read statements.", requirement_ids: [REQ-253-003] }
    - { id: SCN-253-004, description: "Execution separation and replay protection hold under retry.", requirement_ids: [REQ-253-004, REQ-253-006] }
    - { id: SCN-253-005, description: "RTO attribution respects locks and audit authority.", requirement_ids: [REQ-253-005] }
    - { id: SCN-253-006, description: "Validation is non-production and does not execute a payout.", requirement_ids: [REQ-253-006] }
invariants:
    - { id: INV-253-001, description: "No missing commission policy becomes a numeric fallback." }
    - { id: INV-253-002, description: "Approved or later cycles cannot be recalculated." }
    - { id: INV-253-003, description: "Unauthorized statement requests cannot read payout data." }
    - { id: INV-253-004, description: "One cycle-and-brand identity cannot create two effective payouts." }
    - { id: INV-253-005, description: "Locked RTO attribution cannot be changed." }
    - { id: INV-253-006, description: "REN-253 does not clear or execute payouts." }
flows:
    - { id: FLOW-253-001, description: "Payout calculation validates cycle state, resolves commission fail-closed, and persists only an allowed calculation.", state_transitions: [draft, calculated] }
    - { id: FLOW-253-002, description: "Statement request authenticates and authorizes before loading payout data and rendering the existing PDF.", state_transitions: [statement_requested, statement_denied, statement_rendered] }
    - { id: FLOW-253-003, description: "Execution gate validates separation and stable cycle-and-brand replay identity before provider submission.", state_transitions: [approved, processing, completed, replay_rejected] }
    - { id: FLOW-253-004, description: "RTO attribution uses the lock-aware audited Return/Replace authority.", state_transitions: [unlocked_rto, locked_rto] }
dependencies:
    - { id: DEP-253-001, name: REN-203, purpose: "Approved commission fallback disposition", description: "Existing issue defines fail-closed commission behavior and prohibits unapproved rates.", status: resolved }
    - { id: DEP-253-002, name: finance access, purpose: "Existing payout view/manage and site-admin authorization", description: "Existing module_access and finance access helpers provide per-user payout permissions.", status: resolved }
    - { id: DEP-253-003, name: release evidence, purpose: "Read-only deployment/migration verification and release ownership", description: "Ayan records evidence; Akshay reviews and owns the release decision.", status: resolved }
integrations:
    - { id: INT-253-001, system: Razorpay payouts, purpose: "Provider payout submission", failure_mode: "Retry or ambiguous response could duplicate a payout", retry_idempotency: "Stable cycle-and-brand reference with local completion guard" }
    - { id: INT-253-002, system: finance audit, purpose: "Record control decisions and RTO attribution", failure_mode: "Untraceable financial mutation", retry_idempotency: "Existing audit conventions and dedupe keys" }
security_boundaries:
    - { id: SEC-253-001, description: "Only existing payout finance access or site Admin may read statements." }
    - { id: SEC-253-002, description: "Clearer and executor identities must be distinct where required." }
    - { id: SEC-253-003, description: "RTO attribution changes require lock enforcement and audit evidence." }
personas:
    - { id: PER-253-001, role: finance_operator, applicability: "May calculate or review payout information according to existing finance access." }
    - { id: PER-253-002, role: programme_release_reviewer, applicability: "Reviews evidence and owns the C0 release decision." }
business_rules:
    - { id: BR-253-001, description: "No payout is cleared or executed by REN-253." }
    - { id: BR-253-002, description: "Missing commission policy never becomes a silent numeric fallback." }
    - { id: BR-253-003, description: "Only draft and calculated cycles may be recalculated." }
decisions:
    - { id: DEC-253-001, question: "Which payout-cycle statuses may be recalculated?", class: HUMAN_CONFIRMATION, status: resolved, recommendation: "Allow draft and calculated only.", basis: "Prevents changes after approval or execution activity.", confidence: high, consequence: high, human_confirmation_required: true }
    - { id: DEC-253-002, question: "Who may view payout statements?", class: HUMAN_CONFIRMATION, status: resolved, recommendation: "Existing payouts finance view/manage access or site Admin inheritance.", basis: "Matches existing role and module access without inventing a brand role.", confidence: high, consequence: high, human_confirmation_required: true }
    - { id: DEC-253-003, question: "How are duplicate payouts identified?", class: HUMAN_CONFIRMATION, status: resolved, recommendation: "Use a stable cycle-and-brand reference and reject or deduplicate repeats.", basis: "Prevents replayed payout submission.", confidence: high, consequence: high, human_confirmation_required: true }
    - { id: DEC-253-004, question: "Which RTO path is authoritative?", class: HUMAN_CONFIRMATION, status: resolved, recommendation: "Return/Replace lock-aware audited path only.", basis: "It already enforces payout locking and audit evidence.", confidence: high, consequence: high, human_confirmation_required: true }
test_expectations:
    - { id: TEXP-253-001, category: unit, classification: REQUIRED, reason: "Verify commission fallback cannot create an unapproved payout amount.", scenarios: [SCN-253-001] }
    - { id: TEXP-253-002, category: integration, classification: REQUIRED, reason: "Verify all allowed and rejected payout-cycle states.", scenarios: [SCN-253-002] }
    - { id: TEXP-253-003, category: security, classification: REQUIRED, reason: "Verify statement authentication and finance authorization.", scenarios: [SCN-253-003] }
    - { id: TEXP-253-004, category: integration, classification: REQUIRED, reason: "Verify separation, retry, and duplicate payout protection without live provider execution.", scenarios: [SCN-253-004] }
    - { id: TEXP-253-005, category: security, classification: REQUIRED, reason: "Verify locked RTO attribution rejection and audit behavior.", scenarios: [SCN-253-005] }
    - { id: TEXP-253-006, category: regression, classification: REQUIRED, reason: "Verify existing finance behavior and no payout execution in validation.", scenarios: [SCN-253-006] }
