  - {id: TEXP-245-4, category: integration, classification: REQUIRED, reason: Proves exactly-one, conflict, and no-match handling without enumeration., scenarios: [SCN-245-4, SCN-245-5, SCN-245-6]}
  - {id: TEXP-245-5, category: integration, classification: REQUIRED, reason: Proves confirmed Clerk verification/claim handoff, consent, expiry, single-use, and safe retry., scenarios: [SCN-245-6, SCN-245-7]}
