schema_version: "1.0"
task:
  id: REN-245
  title: Improve grievance submission, identity matching, and customer grievance portal
  source: linear
  branch: ayanganguly333/ren-245-improve-grievance-submission-identity-matching-and-customer
  status: BLOCKED
  linear:
    url: https://linear.app/renivet/issue/REN-245/improve-grievance-submission-identity-matching-and-customer
    priority: 0
    labels: []
    status: Backlog
    assignee: Ayan Ganguly
    project: null
risk:
  initial_risk: L3
  path_rule_risk: L3
  semantic_risk: L3
  final_risk: L3
  reasons: [Customer identity matching and account access are security-sensitive., Grievance tickets contain customer/order context and authenticated replies., Guest account creation integrates with Clerk verification.]
  escalation_history: []
investigation:
  depth: dependency_tracing
  investigated_areas: [Linear issue/comments/relations, public grievance form, legal mutation, user-support schema/router, Help Center pages/components, profile navigation, user schema, Clerk webhook/auth flows, admin grievance queue, SLA/audit/alert paths]
  excluded_areas: [production account matching, raw customer enumeration, external Clerk mutation, admin queue redesign, unrelated support categories]
  dependencies: [DEP-245-1, DEP-245-2, DEP-245-3]
  integrations: [INT-245-1, INT-245-2, INT-245-3]
  security_boundaries: [SEC-245-1, SEC-245-2, SEC-245-3]
  state_transitions: [submitted, normalized, account-match-one, account-match-conflict, account-match-none, consented, verification-pending, linked, visible-to-owner, replied, rejected-safe]
  tests: [TEXP-245-1, TEXP-245-2, TEXP-245-3, TEXP-245-4, TEXP-245-5, TEXP-245-6]
  uncertainties: [Guest Clerk verification/claim handoff requires human confirmation., Shared email validator scope must be regression-tested.]
dependencies:
  - {id: DEP-245-1, name: user_support_tickets, purpose: grievance persistence and ownership, description: Existing ticket/message tables retain SLA and audit context, status: resolved}
  - {id: DEP-245-2, name: user-support-router, purpose: protected customer ticket operations, description: Existing list/detail/messages/reply procedures enforce user ownership, status: resolved}
  - {id: DEP-245-3, name: Clerk-auth, purpose: verified guest access, description: Existing phone-first sign-up/sign-in and webhook synchronization, status: available}
integrations:
  - {id: INT-245-1, system: Clerk, purpose: verified account access, failure_mode: verification or claim handoff fails, retry_idempotency: claim is short-lived and single-use}
  - {id: INT-245-2, system: PostgreSQL/Drizzle, purpose: normalized matching and ownership persistence, failure_mode: conflicting identifiers or partial insert, retry_idempotency: matching and creation are atomic}
  - {id: INT-245-3, system: support/audit/alert services, purpose: preserve operations, failure_mode: ticket exists without audit/alert, retry_idempotency: existing dedupe keys remain effective}
personas:
  - {id: PER-245-1, role: guest_customer, applicability: Submits grievance and obtains verified access.}
  - {id: PER-245-2, role: authenticated_customer, applicability: Views and replies to owned grievances.}
  - {id: PER-245-3, role: support_admin, applicability: Handles grievances in the existing queue.}
security_boundaries:
  - {id: SEC-245-1, description: Only authenticated owner IDs may list, view, or reply to grievances.}
  - {id: SEC-245-2, description: Guest responses must not enumerate account existence or expose another customer.}
  - {id: SEC-245-3, description: Credentials and raw auth tokens are never stored; pending claims are opaque, short-lived, and single-use.}
business_rules:
  - {id: BR-245-1, description: Phone is required and normalizes to exactly 10 Indian digits; email is required, trimmed, lowercased, and shared-validated.}
  - {id: BR-245-2, description: Authenticated contact values are prefilled but editable only through explicit action and do not silently change the profile.}
  - {id: BR-245-3, description: Exactly one identity match links; conflicting phone/email matches never merge or guess.}
  - {id: BR-245-4, description: No-match account creation requires explicit consent and verified access.}
  - {id: BR-245-5, description: Existing grievance category/order/SLA/admin/audit/alert behavior remains intact.}
requirements:
  - {id: REQ-245-1, description: Public grievance submission requires server-and-client validation and normalized storage of phone/email and existing fields., type: explicit}
  - {id: REQ-245-2, description: Authenticated customers see known phone/email prefilled with explicit edit behavior and validated submission., type: explicit}
  - {id: REQ-245-3, description: Customers have a dedicated My Grievances experience for owned history, status, timestamps, category, order reference, messages, and replies., type: explicit}
  - {id: REQ-245-4, description: Guest matching links exactly-one matches, safely handles conflicts, and does not expose account existence., type: explicit}
  - {id: REQ-245-5, description: No-match guest submission creates an account only after consent and provides secure verified access., type: explicit}
  - {id: REQ-245-6, description: Every grievance list/detail/message/reply operation enforces authenticated ownership and prevents ticket-ID tampering., type: security}
  - {id: REQ-245-7, description: Existing admin queue, SLA, audit, alerts, categories, order linkage, and ticket behavior remain intact., type: compatibility}
scenarios:
  - {id: SCN-245-1, description: Invalid/formatted phone/email values produce field errors and no ticket; valid values normalize., requirement_ids: [REQ-245-1]}
  - {id: SCN-245-2, description: Authenticated customer sees prefilled values, explicitly edits them, and submits without profile overwrite., requirement_ids: [REQ-245-2]}
  - {id: SCN-245-3, description: Customer opens My Grievances, sees owned cases/messages/status, and replies., requirement_ids: [REQ-245-3, REQ-245-6]}
  - {id: SCN-245-4, description: Guest matches exactly one account and links through secure access without enumeration., requirement_ids: [REQ-245-4, REQ-245-5]}
  - {id: SCN-245-5, description: Phone/email match different accounts; no merge/guess occurs and support gets safe review outcome., requirement_ids: [REQ-245-4]}
  - {id: SCN-245-6, description: No-match guest accepts consent and completes verified access before tracking the grievance., requirement_ids: [REQ-245-5]}
  - {id: SCN-245-7, description: Missing consent, failed verification, duplicate retry, or expired claim has a safe retry path and no duplicate access., requirement_ids: [REQ-245-5, REQ-245-6]}
  - {id: SCN-245-8, description: Customer attempts another ticket ID and receives denial without data leakage., requirement_ids: [REQ-245-6]}
  - {id: SCN-245-9, description: Existing admin queue/SLA/audit/alerts/category/order behavior remains intact., requirement_ids: [REQ-245-7]}
invariants:
  - {id: INV-245-1, description: No invalid normalized identity reaches persistence or matching.}
  - {id: INV-245-2, description: Customer access is limited to tickets whose userId equals authenticated user ID.}
  - {id: INV-245-3, description: Conflicting matches never merge, guess, or expose accounts.}
  - {id: INV-245-4, description: Guest claims become visible only after verified access and are single-use.}
  - {id: INV-245-5, description: Retry cannot create duplicate linkage or duplicate grievance for one claim.}
  - {id: INV-245-6, description: Existing SLA, audit, alert, category, order, and message semantics are preserved.}
flows:
  - {id: FLOW-245-1, description: Public form -> shared validation -> identity resolution -> ticket persistence -> existing audit/alert/SLA., state_transitions: [submitted, normalized, account-match-one, account-match-conflict, account-match-none, linked, rejected-safe]}
  - {id: FLOW-245-2, description: Authenticated profile -> prefilled form -> owned grievance list/detail -> authorized reply., state_transitions: [normalized, visible-to-owner, replied]}
  - {id: FLOW-245-3, description: No-match consent -> Clerk verification -> opaque claim -> owner-visible grievance., state_transitions: [consented, verification-pending, linked, visible-to-owner]}
decisions:
  - {id: DEC-245-1, question: How should a no-match guest gain access?, class: HUMAN_CONFIRMATION, status: unresolved, recommendation: Use existing Clerk verification with an opaque short-lived server-side pending claim consumed after verified sign-in/sign-up., basis: Reuses existing auth and avoids credential storage or identifier disclosure., confidence: medium, consequence: high, human_confirmation_required: true}
  - {id: DEC-245-2, question: Should authenticated contact fields be editable?, class: HUMAN_CONFIRMATION, status: resolved, recommendation: Yes, explicit edit action with no profile mutation., basis: Explicit Linear requirement., confidence: high, consequence: medium, human_confirmation_required: true, confirmation_source: Linear REN-245 description on 2026-09-29}
  - {id: DEC-245-3, question: What happens when phone/email match different accounts?, class: HUMAN_CONFIRMATION, status: resolved, recommendation: Do not associate or merge; return safe outcome and route for support review., basis: Explicit Linear security requirement., confidence: high, consequence: high, human_confirmation_required: true, confirmation_source: Linear REN-245 description on 2026-09-29}
critic:
  required: true
  completed: true
  artifact: CRITIQUE.md
  reviewer: Independent read-only contract critic
  fresh_context: true
  read_only: true
  required_categories: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
  categories_reviewed: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
  findings:
    - {id: CRIT-245-001, severity: DESIGN_BLOCKER, status: open, summary: Guest account/access handoff requires confirmation.}
    - {id: CRIT-245-002, severity: MAJOR, status: addressed, summary: Account enumeration protections are specified.}
    - {id: CRIT-245-003, severity: MAJOR, status: addressed, summary: Ownership and IDOR coverage are required.}
    - {id: CRIT-245-004, severity: MAJOR, status: open, summary: Shared email validator scope needs regression coverage.}
    - {id: CRIT-245-005, severity: MINOR, status: addressed, summary: Indian phone normalization edge cases are test requirements.}
approval:
  state: BLOCKED
  design_blockers: [DEC-245-1, CRIT-245-001, CRIT-245-004]
  approved_by: ""
