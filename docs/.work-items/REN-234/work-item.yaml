        - { requirement_id: REQ-234-005, scenario_ids: [SCN-234-001] }
        - { requirement_id: REQ-234-006, scenario_ids: [SCN-234-001, SCN-234-002, SCN-234-006, SCN-234-007] }
        - { requirement_id: REQ-234-007, scenario_ids: [SCN-234-008] }
    scenario_to_invariants:
        - { scenario_id: SCN-234-001, invariant_ids: [INV-234-001, INV-234-004] }
        - { scenario_id: SCN-234-002, invariant_ids: [INV-234-005] }
        - { scenario_id: SCN-234-003, invariant_ids: [INV-234-005] }
        - { scenario_id: SCN-234-004, invariant_ids: [INV-234-002, INV-234-003] }
        - { scenario_id: SCN-234-005, invariant_ids: [INV-234-002] }
        - { scenario_id: SCN-234-006, invariant_ids: [INV-234-004] }
        - { scenario_id: SCN-234-007, invariant_ids: [INV-234-001] }
        - { scenario_id: SCN-234-008, invariant_ids: [INV-234-005] }
    scenario_to_test_expectations:
        - { scenario_id: SCN-234-001, test_expectation_ids: [TEXP-234-002, TEXP-234-003] }
        - { scenario_id: SCN-234-002, test_expectation_ids: [TEXP-234-001, TEXP-234-003] }
        - { scenario_id: SCN-234-003, test_expectation_ids: [TEXP-234-002, TEXP-234-003] }
        - { scenario_id: SCN-234-004, test_expectation_ids: [TEXP-234-001, TEXP-234-002] }
        - { scenario_id: SCN-234-005, test_expectation_ids: [TEXP-234-001, TEXP-234-003] }
        - { scenario_id: SCN-234-006, test_expectation_ids: [TEXP-234-003] }
        - { scenario_id: SCN-234-007, test_expectation_ids: [TEXP-234-002] }
        - { scenario_id: SCN-234-008, test_expectation_ids: [TEXP-234-004] }
