    scenario_to_invariants: [{ scenario_id: SCN-271-001, invariant_ids: [INV-271-001] }, { scenario_id: SCN-271-002, invariant_ids: [INV-271-002] }, { scenario_id: SCN-271-003, invariant_ids: [INV-271-003] }]
