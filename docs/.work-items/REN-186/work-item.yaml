        - { scenario_id: SCN-004, invariant_ids: [INV-002] }
        - { scenario_id: SCN-005, invariant_ids: [INV-001, INV-004] }
        - { scenario_id: SCN-006, invariant_ids: [INV-001, INV-004, INV-006] }
        - { scenario_id: SCN-007, invariant_ids: [INV-003, INV-004] }
        - { scenario_id: SCN-008, invariant_ids: [INV-002, INV-005] }
        - { scenario_id: SCN-009, invariant_ids: [INV-003] }
    scenario_to_test_expectations:
        - { scenario_id: SCN-001, test_expectation_ids: [TEXP-001, TEXP-003] }
        - { scenario_id: SCN-002, test_expectation_ids: [TEXP-001, TEXP-003] }
        - { scenario_id: SCN-003, test_expectation_ids: [TEXP-002] }
        - { scenario_id: SCN-004, test_expectation_ids: [TEXP-002] }
        - { scenario_id: SCN-005, test_expectation_ids: [TEXP-001, TEXP-002] }
        - { scenario_id: SCN-006, test_expectation_ids: [TEXP-002, TEXP-004, TEXP-005] }
        - { scenario_id: SCN-007, test_expectation_ids: [TEXP-001, TEXP-003, TEXP-005] }
        - { scenario_id: SCN-008, test_expectation_ids: [TEXP-004] }
        - { scenario_id: SCN-009, test_expectation_ids: [TEXP-004] }
