    requirement_to_scenarios:
        - { requirement_id: REQ-001, scenario_ids: [SCN-002] }
        - { requirement_id: REQ-002, scenario_ids: [SCN-001, SCN-002] }
        - { requirement_id: REQ-003, scenario_ids: [SCN-001, SCN-003, SCN-005] }
        - { requirement_id: REQ-004, scenario_ids: [SCN-004] }
        - { requirement_id: REQ-005, scenario_ids: [SCN-005, SCN-006, SCN-007, SCN-008, SCN-009] }
        - { requirement_id: REQ-006, scenario_ids: [SCN-006, SCN-007] }
    scenario_to_invariants:
        - { scenario_id: SCN-001, invariant_ids: [INV-001, INV-003] }
        - { scenario_id: SCN-002, invariant_ids: [INV-003] }
