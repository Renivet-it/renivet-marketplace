    required: true
    completed: true
    artifact: CRITIQUE.md
    reviewer: Codex (fresh-context independent critic)
    fresh_context: true
    read_only: true
    categories_reviewed: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
    findings:
        - id: CRIT-110-001
          severity: MAJOR
          references: [REQ-110-003, DEP-110-001, SCN-110-003]
          description: ProductSearch is shared by multiple storefront surfaces; shared-consumer coverage is now required.
        - id: CRIT-110-002
          severity: MINOR
          references: [REQ-110-001, TEXP-110-001]
          description: Description text, sr-only placement, and deterministic warning capture are explicit.
