        - { requirement_id: REQ-209-006, scenario_ids: [SCN-209-005] }
        - { requirement_id: REQ-209-007, scenario_ids: [SCN-209-001, SCN-209-006] }
        - { requirement_id: REQ-209-008, scenario_ids: [SCN-209-003, SCN-209-004] }
    scenario_to_invariants:
        - { scenario_id: SCN-209-001, invariant_ids: [INV-209-001, INV-209-003] }
        - { scenario_id: SCN-209-002, invariant_ids: [INV-209-002] }
        - { scenario_id: SCN-209-003, invariant_ids: [INV-209-003, INV-209-005] }
        - { scenario_id: SCN-209-004, invariant_ids: [INV-209-004] }
        - { scenario_id: SCN-209-005, invariant_ids: [INV-209-005] }
