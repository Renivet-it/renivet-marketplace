schema_version: "1.0"
task:
    id: REN-209
    title: "[FCCP][P1] Establish Brand Commercial Configuration Control"
    source: linear
    branch: feat/ren-203-spec
    status: BLOCKED
    linear:
        url: https://linear.app/renivet/issue/REN-209/fccp1-establish-brand-commercial-configuration-control
        priority: High
        labels: [Improvement]
        status: Backlog
        assignee: Ayan Ganguly
        project: "Renivet — Financial & Compliance Control Program"
        parent: REN-202
        linear_branch: ayanganganguly333/ren-209-fccp1-establish-brand-commercial-configuration-control
risk:
    initial_risk: L3
    path_rule_risk: L3
    semantic_risk: L3
    final_risk: L3
    reasons:
        - "This task changes financial commercial configuration and future payout inputs."
        - "A wrong or undocumented rate could change payable amounts."
        - "Agreement linkage, tenant authorization, effective dates, and auditability are security and compliance boundaries."
    escalation_history: []
investigation:
    depth: dependency_tracing
    investigated_areas: [Linear issue/comments/relations, commission_rules schema, payout resolver, finance routes, REN-208 agreement repository, holdback controls, existing tests]
    excluded_areas: [production data mutation, payout execution, Payment Fee formula, brand-facing UI, contract timestamp writes]
    dependencies: [DEP-209-001, DEP-209-002, DEP-209-003, DEP-209-004]
    integrations: [INT-209-001, INT-209-002]
    security_boundaries: [SEC-209-001, SEC-209-002]
    state_transitions: [unconfigured, pending_source, configured_provisional, superseded, access_denied]
    related_tests: [TEXP-209-001, TEXP-209-002, TEXP-209-003, TEXP-209-004, TEXP-209-005]
    uncertainties: ["Terra Luna agreement version and named approver are not available.", "Commission basis and source-reference schema extension are not confirmed."]
requirements:
    - { id: REQ-209-001, description: "Admins can maintain effective-dated brand commercial configuration using the approved commission source of truth.", type: explicit }
    - { id: REQ-209-002, description: "Every populated term cites an agreement version or is explicitly marked no source document on file.", type: auditability }
    - { id: REQ-209-003, description: "Unconfigured brands are visible and produce no payable commission or silent fallback.", type: safety }
    - { id: REQ-209-004, description: "Terra Luna is the only permitted initial populated brand, and only after documentary approval is supplied.", type: financial_control }
    - { id: REQ-209-005, description: "Holdback remains inactive and Payment Fee remains unpopulated until their decisions are resolved.", type: safety }
    - { id: REQ-209-006, description: "Only Renivet Admin roles can access or mutate this surface; brand users are denied.", type: authorization }
    - { id: REQ-209-007, description: "Every change is audit logged with actor, timestamp, before/after values, and source agreement reference.", type: auditability }
    - { id: REQ-209-008, description: "Existing contract timestamps and unrelated payout behavior remain unchanged.", type: compatibility }
scenarios:
    - { id: SCN-209-001, description: "Admin records an approved Terra Luna rule linked to an agreement version.", requirement_ids: [REQ-209-001, REQ-209-002, REQ-209-004, REQ-209-007] }
    - { id: SCN-209-002, description: "A brand without confirmed terms is visibly unconfigured and resolves no payable commission.", requirement_ids: [REQ-209-003] }
    - { id: SCN-209-003, description: "Overlapping/effective-dated rules resolve by delivery date and existing priority semantics.", requirement_ids: [REQ-209-001, REQ-209-008] }
    - { id: SCN-209-004, description: "Holdback and Payment Fee cannot be activated through this surface.", requirement_ids: [REQ-209-005] }
    - { id: SCN-209-005, description: "Brand and unauthenticated users are denied from the admin surface and routes.", requirement_ids: [REQ-209-006] }
    - { id: SCN-209-006, description: "A correction supersedes prior configuration and preserves audit history.", requirement_ids: [REQ-209-001, REQ-209-007] }
invariants:
    - { id: INV-209-001, description: "No unapproved or undocumented commercial value is populated."
    }
    - { id: INV-209-002, description: "Unconfigured brands never receive a fallback payable commission."
    }
    - { id: INV-209-003, description: "Every active rule is effective-dated, scoped, and linked to source evidence or an explicit unavailable state."
    }
    - { id: INV-209-004, description: "Holdback is zero/inactive while BIZ-15 is suspended."
    }
    - { id: INV-209-005, description: "Existing brand contract fields and unrelated payout transitions are unchanged."
    }
flows:
    - { id: FLOW-209-001, description: "Admin validates source, metadata, authorization, and effective dates before writing a rule and audit record.", state_transitions: [pending_source, configured_provisional] }
    - { id: FLOW-209-002, description: "Payout resolution returns no payable commission when no approved rule exists.", state_transitions: [unconfigured, access_denied] }
    - { id: FLOW-209-003, description: "A corrected term supersedes a prior version without erasing audit history.", state_transitions: [configured_provisional, superseded] }
dependencies:
    - { id: DEP-209-001, name: commission_rules, purpose: "Canonical effective-dated commission source", description: "Existing table and resolver must remain the source of truth.", status: resolved }
    - { id: DEP-209-002, name: REN-208, purpose: "Agreement source version", description: "Commercial terms must cite a specific agreement version or explicit unavailable state.", status: blocked }
    - { id: DEP-209-003, name: REN-203, purpose: "Commission calculation boundary", description: "Arithmetic remediation is separate; no arithmetic rewrite here.", status: resolved }
    - { id: DEP-209-004, name: BIZ-13/BIZ-14/BIZ-15/BIZ-16, purpose: "Approved commercial constraints", description: "Terra Luna, Payment Fee, holdback, and delivery-basis decisions constrain writes.", status: blocked }
integrations:
    - { id: INT-209-001, system: PostgreSQL/Drizzle, purpose: "Persist effective-dated commercial configuration", failure_mode: "Partial or invalid writes could change future payable amounts", retry_idempotency: "Writes must be transactional and append/supersede rather than silently overwrite history." }
    - { id: INT-209-002, system: audit_logs and REN-208, purpose: "Evidence and source-document linkage", failure_mode: "Terms without source or audit evidence must be rejected", retry_idempotency: "Audit failure must fail closed." }
personas:
    - { id: PER-209-001, role: renivet_admin, applicability: "Can maintain approved internal configuration." }
    - { id: PER-209-002, role: brand_user, applicability: "Must be denied access." }
security_boundaries:
    - { id: SEC-209-001, description: "Every read/write route authenticates and authorizes Renivet Admin server-side." }
    - { id: SEC-209-002, description: "Brand tenancy, agreement source references, audit values, and financial configuration are not exposed to brand users." }
business_rules:
    - { id: BR-209-001, description: "No commercial value may be invented, defaulted, or inferred by engineering." }
    - { id: BR-209-002, description: "BIZ-15 holdback is suspended and BIZ-14 Payment Fee formula is undecided." }
    - { id: BR-209-003, description: "No interpretation of 25% Including Delivery is encoded." }
decisions:
    - { id: DEC-209-001, question: "Which REN-208 agreement version and named approver authorize Terra Luna's 25%/20% terms?", class: HUMAN_CONFIRMATION, status: unresolved, recommendation: "Provide the exact agreement version, approver, provisional status, and commission basis before implementation.", basis: "Linear REN-209 makes the write production-affecting and explicitly forbids invention or inference.", confidence: high, consequence: high, human_confirmation_required: true }
    - { id: DEC-209-002, question: "Where should source agreement reference, Payment Fee, settlement term, and explicit unavailable state live?", class: HUMAN_CONFIRMATION, status: unresolved, recommendation: "Confirm the minimal extension to commission_rules or an approved adjacent configuration table after REN-208 linkage is available.", basis: "The issue requires source linkage and non-commission terms but forbids a parallel store without justification.", confidence: medium, consequence: high, human_confirmation_required: true }
test_expectations:
    - { id: TEXP-209-001, category: unit, classification: REQUIRED, reason: "Unconfigured resolution, effective dates, priority, and holdback suspension must be deterministic.", scenarios: [SCN-209-002, SCN-209-003, SCN-209-004] }
    - { id: TEXP-209-002, category: integration, classification: REQUIRED, reason: "Admin Terra Luna lifecycle must prove source linkage, provisional values, supersession, and audit records.", scenarios: [SCN-209-001, SCN-209-006] }
    - { id: TEXP-209-003, category: security, classification: REQUIRED, reason: "Admin-only access and brand/unauthenticated denial must be tested directly.", scenarios: [SCN-209-005] }
    - { id: TEXP-209-004, category: regression, classification: REQUIRED, reason: "No unrelated payout arithmetic, contract timestamps, or brand-facing behavior may change.", scenarios: [SCN-209-003, SCN-209-004] }
    - { id: TEXP-209-005, category: integration, classification: REQUIRED, reason: "Database and audit failures must fail closed without partial financial configuration.", scenarios: [SCN-209-001, SCN-209-006] }
critic:
    required: true
    completed: true
    artifact: CRITIQUE.md
    reviewer: independent fresh-context critic
    fresh_context: true
    read_only: true
    required_categories: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
    categories_reviewed: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
    findings:
        - { id: CRIT-209-001, severity: DESIGN_BLOCKER, status: open, summary: "Terra Luna source agreement and approver are missing.", references: [REQ-209-004, DEC-209-001] }
        - { id: CRIT-209-002, severity: DESIGN_BLOCKER, status: open, summary: "Commission basis and source-reference storage decision are unresolved.", references: [REQ-209-001, REQ-209-002, DEC-209-002] }
        - { id: CRIT-209-003, severity: MAJOR, status: open, summary: "Existing holdback defaults require explicit isolation and regression coverage.", references: [REQ-209-005, BR-209-002, TEXP-209-004] }
approval:
    state: BLOCKED
    design_blockers: [CRIT-209-001, CRIT-209-002, CRIT-209-003]
    approved_by: ""
