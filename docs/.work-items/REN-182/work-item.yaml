schema_version: "1.0"
task:
  id: REN-182
  title: "[Corporate Order] Brand Tax Invoice validation must block on material discrepancies, not just flag them"
  source: linear
  branch: ayanganguly333/corporate-order-qc
  status: BLOCKED
  linear:
    url: https://linear.app/renivet/issue/REN-182/corporate-order-brand-tax-invoice-validation-must-block-on-material
    priority: High
    labels: [Bug]
    status: Backlog
    assignee: Ayan Ganguly
    project: null
    milestone: null
risk:
  initial_risk: L3
  path_rule_risk: L3
  semantic_risk: L3
  final_risk: L3
  reasons:
    - Supplier tax invoices are financial records that may influence settlement and reporting.
    - The task changes enforcement, review/override authority, and financial data state transitions.
    - Schema, legacy-data, brand-upload, authorization, and downstream consumer boundaries are involved.
  escalation_history: []
investigation:
  depth: dependency_tracing
  investigated_areas:
    - Linear REN-182 description, relations, and comments
    - Brand tax-invoice creation, validation, review, schema, and document download route
    - Brand-assigned upload path and its fabricated FO-derived values
    - Fulfillment Order source fields and settlement issuance/read paths
    - TRPC authorization boundaries and existing document-chain test script
  excluded_areas:
    - OCR/extraction or visual analysis of uploaded invoice files
    - Customer tax-invoice calculation and unrelated ledger/payout systems
    - Finance/CA legal interpretation beyond the required override policy decision
  dependencies: [DEP-001, DEP-002, DEP-003]
  integrations: [INT-001, INT-002]
  security_boundaries: [SEC-001, SEC-002]
  state_transitions:
    - submitted -> validated
    - submitted_with_material_discrepancy -> held
    - held -> overridden_for_financial_use
    - held -> rejected
  related_tests: [TEXP-001, TEXP-002, TEXP-003, TEXP-004, TEXP-005]
  uncertainties:
    - Financial override authority and whether override permits financial use require human confirmation.
    - Structured data capture required for brand-uploaded files must be selected because OCR is out of scope.
    - Immediate enforcement versus a transition feature flag requires an Ops release decision.
dependencies:
  - id: DEP-001
    name: Fulfillment Order source data
    purpose: Supplies the authoritative order/brand/quantity/rate/amount/reference comparison values.
    description: Current FO schema lacks explicit tax components, so implementation must not claim comparisons without an authoritative source.
    status: partial
  - id: DEP-002
    name: Finance/CA override policy
    purpose: Determines who may override a material discrepancy and its effect on financial use.
    description: This is a financial-control decision, not an engineering default.
    status: unresolved
  - id: DEP-003
    name: Operations rollout decision
    purpose: Determines immediate enforcement or a controlled feature-flag transition with notice.
    description: Linear explicitly requires that the tightening is not shipped silently.
    status: unresolved
requirements:
  - id: REQ-001
    description: Validate supplier GSTIN, recipient GSTIN, HSN, quantity, unit rate, taxable value, GST, arithmetic, FO reference, and total against the authoritative assigned order/FO data.
    type: explicit
  - id: REQ-002
    description: A material discrepancy never silently becomes accepted, validated, or usable as a financial input.
    type: explicit
  - id: REQ-003
    description: Persist every failed validation check and expose a clear error/status to the submitting user and authorized reviewer.
    type: explicit
  - id: REQ-004
    description: An authorized reviewer may perform an explicit, attributed override only under the approved Finance/CA policy and with a mandatory reason.
    type: explicit
  - id: REQ-005
    description: Settlement/reporting consumers explicitly exclude held/rejected invoices and admit only statuses permitted by the approved policy.
    type: explicit
  - id: REQ-006
    description: Brand-file upload does not fabricate invoice values from the FO and label them as the submitted invoice.
    type: inferred
  - id: REQ-007
    description: Existing authorization, brand membership, tenant isolation, historical readability, and uploaded-file access controls remain intact.
    type: inferred
scenarios:
  - id: SCN-001
    description: A fully matching structured invoice is stored as validated and remains available to permitted downstream consumers.
    requirement_ids: [REQ-001, REQ-002, REQ-003, REQ-005]
  - id: SCN-002
    description: An invoice whose taxable value plus GST does not equal its total is held/rejected with the arithmetic failure recorded.
    requirement_ids: [REQ-001, REQ-002, REQ-003]
  - id: SCN-003
    description: An invoice with mismatched supplier or recipient GSTIN is held/rejected with every applicable failed check recorded.
    requirement_ids: [REQ-001, REQ-002, REQ-003]
  - id: SCN-004
    description: An invoice with incorrect HSN, FO reference, quantity, rate, taxable value, GST, or total is held/rejected and cannot be used downstream.
    requirement_ids: [REQ-001, REQ-002, REQ-003, REQ-005]
  - id: SCN-005
    description: An authorized reviewer uses the approved override path with a reason; the original discrepancy evidence and actor/time audit record remain intact.
    requirement_ids: [REQ-002, REQ-003, REQ-004, REQ-005]
  - id: SCN-006
    description: An unauthorized, cross-brand, or missing-reason override attempt is rejected without changing invoice state.
    requirement_ids: [REQ-004, REQ-007]
  - id: SCN-007
    description: A brand-file upload with no extracted structured data is held as unverified or requires structured capture under the approved policy; it is never falsely validated from copied FO values.
    requirement_ids: [REQ-002, REQ-006, REQ-007]
  - id: SCN-008
    description: A pre-existing pending/validated/rejected record remains readable after migration and does not gain financial trust silently.
    requirement_ids: [REQ-002, REQ-007]
invariants:
  - id: INV-001
    description: A material validation discrepancy cannot enter financial settlement/reporting as a trusted invoice without an explicit authorized override under the approved policy.
  - id: INV-002
    description: Validation findings, source comparison reference, and override audit evidence are preserved and cannot be erased by normal review.
  - id: INV-003
    description: Only the assigned brand/order/FO data is used for comparison.
  - id: INV-004
    description: No server path fabricates invoice facts from FO data while representing them as brand-submitted data.
  - id: INV-005
    description: Authorization and tenant/brand boundaries apply to submission, review, override, download, and downstream reads.
flows:
  - id: FLOW-001
    description: Structured supplier invoice submission -> authoritative FO/order comparison -> validated or held/rejected record -> restricted consumer read.
    state_transitions: [submitted -> validated, submitted_with_material_discrepancy -> held]
  - id: FLOW-002
    description: Held invoice -> authorized reasoned override -> policy-permitted financial use, retaining original findings and audit evidence.
    state_transitions: [held -> overridden_for_financial_use]
  - id: FLOW-003
    description: Brand file upload -> structured capture/explicit unverified hold -> no fabricated validation result.
    state_transitions: [submitted_with_material_discrepancy -> held]
integrations:
  - id: INT-001
    system: Corporate database
    purpose: Persist invoices, validation results, state transitions, reviewer attribution, and legacy-compatible migration.
    failure_mode: Transaction rollback leaves no partially trusted invoice state.
  - id: INT-002
    system: Uploaded invoice-file provider
    purpose: Store and serve the supplier-uploaded evidence file under existing access control.
    failure_mode: File upload failure prevents invoice submission; no document row is trusted without the associated evidence.
personas:
  - id: PER-001
    role: brand_member
    applicability: Uploads the supplier invoice for an assigned order.
  - id: PER-002
    role: corporate_operations_admin
    applicability: Captures/reviews structured invoice data under existing order permissions.
  - id: PER-003
    role: finance_or_ca_reviewer
    applicability: Performs any approved financial-use override with an attributed reason.
security_boundaries:
  - id: SEC-001
    description: Brand members can submit only for their assigned brand/order and must not access other brands' invoice data or files.
  - id: SEC-002
    description: Financial override requires the approved authorization boundary and immutable actor/time/reason evidence.
business_rules:
  - id: BR-001
    description: Material discrepancies must block/hold acceptance rather than merely be tagged for later review.
    source: Linear REN-182 expected behavior and acceptance criteria.
  - id: BR-002
    description: OCR/extraction of uploaded invoice files is out of scope; enforcement is based on captured structured data.
    source: Linear REN-182 out of scope.
  - id: BR-003
    description: The release must be communicated to Operations and must not silently tighten live-brand behavior.
    source: Linear REN-182 rollback/release notes.
decisions:
  - id: DEC-001
    question: Should material-discrepancy submissions be retained as held records or rejected without creating a financial invoice row?
    class: HUMAN_CONFIRMATION
    status: unresolved
    recommendation: Retain as held, preserving evidence while excluding it from financial use.
    basis: Supports correction/audit without silent financial acceptance.
    confidence: high
    consequence: high
    human_confirmation_required: true
  - id: DEC-002
    question: Which permission/role can override a held invoice, and may that override admit it to settlement/reporting?
    class: HUMAN_CONFIRMATION
    status: unresolved
    recommendation: Finance/CA-only authority; require reason, actor, time, and explicitly permit financial use only after that override.
    basis: The action changes the trust status of a financial record.
    confidence: high
    consequence: high
    human_confirmation_required: true
  - id: DEC-003
    question: How should file-only brand uploads be handled without OCR?
    class: HUMAN_CONFIRMATION
    status: unresolved
    recommendation: Store as unverified/held until authorized structured capture, rather than copying FO values into an apparently validated invoice.
    basis: Existing path cannot compare facts found only inside a file.
    confidence: high
    consequence: high
    human_confirmation_required: true
  - id: DEC-004
    question: Is enforcement immediate or feature-flagged for a defined transition period with Ops notice?
    class: HUMAN_CONFIRMATION
    status: unresolved
    recommendation: Short-lived, auditable feature flag plus Operations announcement, then default-on enforcement.
    basis: Linear requests a non-silent rollout while requiring enforcement.
    confidence: medium
    consequence: high
    human_confirmation_required: true
test_expectations:
  - id: TEXP-001
    category: integration
    classification: REQUIRED
    reason: A fully matching invoice must validate and normal permitted consumer behavior must remain available.
    scenarios: [SCN-001]
  - id: TEXP-002
    category: integration
    classification: REQUIRED
    reason: Arithmetic and GSTIN mismatches must be held/rejected, record all issues, and not become trusted.
    scenarios: [SCN-002, SCN-003]
  - id: TEXP-003
    category: integration
    classification: REQUIRED
    reason: HSN, FO reference, quantity, rate, taxable value, GST, and total mismatches need fail-closed coverage.
    scenarios: [SCN-004]
  - id: TEXP-004
    category: security
    classification: REQUIRED
    reason: Override authorization, mandatory reason, brand isolation, and file/document access require direct verification.
    scenarios: [SCN-005, SCN-006, SCN-007]
  - id: TEXP-005
    category: regression
    classification: REQUIRED
    reason: Historical records and downstream settlement/reporting selectors must not gain untrusted invoice use after migration.
    scenarios: [SCN-004, SCN-008]
critic:
  required: true
  completed: true
  artifact: CRITIQUE.md
  reviewer: ren182_critic
  fresh_context: true
  read_only: true
  required_categories: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
  categories_reviewed: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
  findings:
    - {id: CRIT-001, severity: DESIGN_BLOCKER, summary: FO lacks authoritative taxable-value and GST-component comparison fields.}
    - {id: CRIT-002, severity: MAJOR, summary: Supplier-asserted FO reference field and comparison normalization are unspecified.}
    - {id: CRIT-003, severity: MAJOR, summary: Resubmission, duplicates, races, and active/superseded record semantics are unspecified.}
    - {id: CRIT-004, severity: DESIGN_BLOCKER, summary: Financial override permission, service authorization, and immutable attribution are unspecified.}
    - {id: CRIT-005, severity: DESIGN_BLOCKER, summary: Invoice trust state model and transitions are incomplete.}
    - {id: CRIT-006, severity: MAJOR, summary: Submission, upload, and override idempotency/recovery are unspecified.}
    - {id: CRIT-007, severity: MAJOR, summary: Legacy trust migration and rollout-flag behavior are unspecified.}
    - {id: CRIT-008, severity: MAJOR, summary: Audit, queue, telemetry, and race/consumer test contracts are incomplete.}
    - {id: CRIT-009, severity: DESIGN_BLOCKER, summary: Financial versus informational consumer inventory and trusted-query contract are incomplete.}
approval:
  state: BLOCKED
  design_blockers: [DEC-001, DEC-002, DEC-003, DEC-004, CRIT-001, CRIT-004, CRIT-005, CRIT-009]
  approved_by: null
