    - {requirement_id: REQ-002, scenario_ids: [SCN-001, SCN-002, SCN-003, SCN-004, SCN-005, SCN-007, SCN-008]}
    - {requirement_id: REQ-003, scenario_ids: [SCN-001, SCN-002, SCN-003, SCN-004, SCN-005]}
    - {requirement_id: REQ-004, scenario_ids: [SCN-005, SCN-006]}
    - {requirement_id: REQ-005, scenario_ids: [SCN-001, SCN-004, SCN-005]}
    - {requirement_id: REQ-006, scenario_ids: [SCN-007]}
    - {requirement_id: REQ-007, scenario_ids: [SCN-006, SCN-007, SCN-008]}
  scenario_to_invariants:
    - {scenario_id: SCN-001, invariant_ids: [INV-001, INV-002, INV-003]}
    - {scenario_id: SCN-002, invariant_ids: [INV-001, INV-002]}
    - {scenario_id: SCN-003, invariant_ids: [INV-001, INV-002]}
    - {scenario_id: SCN-004, invariant_ids: [INV-001, INV-002, INV-003]}
    - {scenario_id: SCN-005, invariant_ids: [INV-001, INV-002, INV-005]}
    - {scenario_id: SCN-006, invariant_ids: [INV-002, INV-005]}
    - {scenario_id: SCN-007, invariant_ids: [INV-001, INV-004, INV-005]}
