    fresh_context: true
    read_only: true
    required_categories: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
    categories_reviewed: [requirements_scenarios, failure_recovery, security_privacy, state_data_consistency, integrations_idempotency, compatibility_migration, observability_testability, assumptions_dependencies]
    findings:
        - { classification: DESIGN_BLOCKER, description: Original unsafe-any scope and dynamic JSON/audit compatibility were ambiguous; amended in SPEC and work-item contract. }
        - { classification: MAJOR, description: Original context narrowing, enum mapping, and test expectations were underspecified; amended with explicit boundaries and TEXP-002. }
        - { classification: MINOR, description: Original failure and compatibility semantics were implicit; amended with explicit preservation rules. }
