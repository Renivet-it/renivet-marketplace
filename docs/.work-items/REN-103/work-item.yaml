        - Finance router changes cross authorization, finance services, database enum values, and audit events.
        - The approved increment is compile-time focused but must preserve finance behavior and security boundaries.
    escalation_history: []
investigation:
    depth: dependency_tracing
    investigated_areas: [Linear REN-103, finance router, tRPC context, finance services, finance schema values, audit helper, existing tests]
    excluded_areas: [product.ts, order-ops.ts, order queries, remaining repository any cleanup, schema/migration changes]
    dependencies: [DEP-001, DEP-002, DEP-003]
    integrations: []
    security_boundaries: [SEC-001]
    state_transitions: [untyped-finance-router -> typed-finance-router]
dependencies:
    - { id: DEP-001, name: tRPC Context, purpose: Type authenticated user and query context, description: Existing repository context type., status: resolved }
    - { id: DEP-002, name: finance schema/service types, purpose: Type enum and service boundary values, description: Existing finance schemas and helpers., status: resolved }
    - { id: DEP-003, name: finance audit helper, purpose: Preserve audit JSON payload typing, description: Existing writeFinanceAuditEvent contract., status: resolved }
integrations: []
personas:
    - { id: PER-001, role: finance_admin, applicability: Uses protected finance procedures and audit-backed workflows. }
security_boundaries:
    - { id: SEC-001, description: Existing authentication, finance module authorization, user identity, and audit behavior must remain unchanged. }
business_rules:
    - { id: BR-001, description: This increment is a type-only refactor with no intentional runtime finance behavior change., source: REN-103 approved incremental scope. }
decisions:
    - id: DEC-001
      question: Which REN-103 slice is implemented in this PR?
      class: B
      status: resolved
      recommendation: Finance router first; defer product and order-ops to later PRs.
      basis: Linear explicitly requests incremental prioritization and finance/order-ops are named priorities.
      confidence: high
      consequence: medium
      human_confirmation_required: false
      confirmation_source: User confirmation in conversation on 2026-09-11.
requirements:
    - id: REQ-001
      description: "Finance router has no explicit any annotations/casts (: any, as any, any[]); existing z.any() schemas remain unchanged to preserve arbitrary JSON input acceptance."
      type: explicit
    - { id: REQ-002, description: Context and finance inputs use inferred or named repository types., type: explicit }
    - { id: REQ-003, description: Refund costAllocation and COD categorization retain their existing enumerated value sets without runtime narrowing or widening., type: compatibility }
    - { id: REQ-004, description: Dynamic JSON inputs retain arbitrary-value acceptance and typed audit conversion preserves existing fields and values., type: compatibility }
    - { id: REQ-005, description: Authorization, procedure contracts, service calls, and finance behavior remain unchanged., type: compatibility }
scenarios:
    - { id: SCN-001, description: Authorized finance users reach the same view/manage procedures., requirement_ids: [REQ-002, REQ-005] }
    - { id: SCN-002, description: Unauthorized and forbidden requests retain existing errors., requirement_ids: [REQ-005] }
    - { id: SCN-003, description: Finance procedures preserve inputs, service calls, database writes, and audit events., requirement_ids: [REQ-003, REQ-004, REQ-005] }
    - { id: SCN-004, description: Source regression guard prevents unsafe any annotations/casts while allowing documented z.any() schemas., requirement_ids: [REQ-001] }
invariants:
    - { id: INV-001, description: No finance calculation, authorization decision, database mutation, or audit payload semantics change. }
    - { id: INV-002, description: The router remains compatible with the existing AppRouter procedure contract. }
flows:
    - { id: FLOW-001, description: tRPC context/input -> typed guard/service arguments -> existing finance service/database/audit boundaries., state_transitions: [untyped-finance-router -> typed-finance-router] }
test_expectations:
    - { id: TEXP-001, category: regression, classification: REQUIRED, reason: Source guard prevents explicit any annotations/casts while allowing documented z.any() schemas., scenarios: [SCN-004] }
    - { id: TEXP-002, category: unit, classification: REQUIRED, reason: Focused assertions cover context narrowing, exact enum values, arbitrary JSON compatibility, audit payload preservation, and unchanged procedure markers., scenarios: [SCN-001, SCN-003] }
    - { id: TEXP-003, category: regression, classification: REQUIRED, reason: Existing finance tests and complete Bun suite must pass., scenarios: [SCN-001, SCN-002, SCN-003] }
